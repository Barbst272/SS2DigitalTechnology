          </div>
          <button class="mini-btn" id="cbtSubmit" style="width:100%;margin-top:16px;">Submit Exam</button>
        </div>
      </div>
    </div>`;
  content.appendChild(wrap);

  function drawGrid(){
    wrap.querySelector("#cbtGrid").innerHTML = cbtSession.questions.map((q,i)=>{
      let cls = "";
      if(cbtSession.answers[i]!==undefined) cls += " answered";
      if(cbtSession.flagged.has(i)) cls += " flagged";
      if(i===cbtSession.currentIdx) cls += " current";
      return `<button class="cbt-nav-btn${cls}" data-i="${i}">${i+1}</button>`;
    }).join("");
    wrap.querySelectorAll(".cbt-nav-btn").forEach(b=>b.addEventListener("click",()=>{ cbtSession.currentIdx = parseInt(b.dataset.i); drawQuestion(); }));
  }

  function drawQuestion(){
    const i = cbtSession.currentIdx, q = cbtSession.questions[i];
    wrap.querySelector("#cbtQMeta").textContent = `Question ${i+1} of ${cbtSession.questions.length} — Topic ${q.topicNum}: ${q.topicTitle}`;
    wrap.querySelector("#cbtQText").textContent = q.q.replace(/&gt;/g,">").replace(/&lt;/g,"<");
    wrap.querySelector("#cbtOptions").innerHTML = q.opts.map((o,oi)=>`
      <div class="cbt-option ${cbtSession.answers[i]===oi?'picked':''}" data-oi="${oi}">${o}</div>`).join("");
    wrap.querySelectorAll(".cbt-option").forEach(el=>el.addEventListener("click",()=>{
      cbtSession.answers[i] = parseInt(el.dataset.oi);
      drawQuestion(); drawGrid();
    }));
    wrap.querySelector("#cbtFlag").textContent = cbtSession.flagged.has(i) ? "🚩 Unflag question" : "🚩 Flag for review";
    wrap.querySelector("#cbtPrev").disabled = i===0;
    wrap.querySelector("#cbtNext").textContent = i===cbtSession.questions.length-1 ? "Review / Submit" : "Next →";
    drawGrid();
  }

  wrap.querySelector("#cbtSpeakQ").addEventListener("click", () => {
    const i = cbtSession.currentIdx, q = cbtSession.questions[i];
    const letters = ["A", "B", "C", "D"];
    const optsTxt = q.opts.map((o, idx) => `Option ${letters[idx]}: ${o}`).join(". ");
    const text = `Question ${i+1}. ${q.q}. ${optsTxt}`;
    speakText(text, `Question ${i+1}`);
  });

  wrap.querySelector("#cbtPrev").addEventListener("click",()=>{ if(cbtSession.currentIdx>0){ cbtSession.currentIdx--; drawQuestion(); } });
  wrap.querySelector("#cbtNext").addEventListener("click",()=>{
    if(cbtSession.currentIdx < cbtSession.questions.length-1){
      cbtSession.currentIdx++; drawQuestion();
    } else {
      wrap.querySelector("#cbtSubmit").click();
    }
  });
  wrap.querySelector("#cbtFlag").addEventListener("click",()=>{
    const i = cbtSession.currentIdx;
    if(cbtSession.flagged.has(i)) cbtSession.flagged.delete(i); else cbtSession.flagged.add(i);
    drawQuestion();
  });
  wrap.querySelector("#cbtSubmit").addEventListener("click",()=>{
    const unanswered = cbtSession.questions.length - Object.keys(cbtSession.answers).length;
    const msg = unanswered>0
      ? `You have ${unanswered} unanswered question(s). Submit your exam now?`
      : `Submit your exam now? This cannot be undone.`;
    if(window.confirm(msg)) submitCbt(false);
  });
  drawQuestion();
}

      <div class="hint" style="margin-top:8px;">💡 <strong>Explanation:</strong> ${q.exp}</div>

  wrap.innerHTML = `
    <div class="cbt-start-card" style="text-align:center;max-width:680px;">
      <h2>${passed?"🎉 Exam Complete — Passed!":"📋 Exam Complete"}</h2>
      <p class="lead">${cbtSession.autoSubmitted ? "Time elapsed — exam was submitted automatically." : "Your exam has been graded."}</p>
      <div class="cbt-meta-row">

      </div>
      <table style="width:100%;border-collapse:collapse;font-size:13px;margin:16px 0;text-align:left;">
        <tr><th style="border:1px solid var(--border-light);padding:7px 10px;background:var(--paper-dim);">Topic</th><th style="border:1px solid var(--border-light);padding:7px 10px;background:var(--paper-dim);">Score</th><th style="border:1px solid var(--border-light);padding:7px 10px;background:var(--paper-dim);">%</th></tr>
        ${rows}
      </table>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        <button class="mini-btn" id="cbtRetake">↻ Retake Exam</button>
        <button class="mini-btn ghost" id="cbtHome">← Back to Home</button>
      </div>
    </div>
    <p class="section-lbl" style="max-width:680px;margin:28px auto 12px;">Full Answer Review</p>
    <div style="max-width:680px;margin:0 auto;">${review}</div>
  `;
  content.appendChild(wrap);
  wrap.querySelector("#cbtRetake").addEventListener("click",()=>{ cbtSession = null; render(); });
  wrap.querySelector("#cbtHome").addEventListener("click",()=>{ cbtSession = null; state.view="home"; render(); });
}

// Keyboard Navigation & Shortcuts
window.addEventListener("keydown", (e) => {
  const isInput = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement && document.activeElement.tagName);
  if(isInput && !e.altKey && e.key !== "Escape") return;

  if(e.key === "Escape"){
    const modal = document.getElementById("modalHost");
    if(modal && modal.innerHTML){ modal.innerHTML = ""; return; }
    stopSpeaking();
    return;
  }
  if(e.key === "?" && !isInput){
    e.preventDefault();
    openShortcutsModal();
    return;
  }
  if(e.altKey){
    const k = e.key.toLowerCase();
    if(k === "w"){ e.preventDefault(); state.view="welcome"; render(); }
    else if(k === "h"){ e.preventDefault(); state.view="home"; render(); }
    else if(k >= "1" && k <= "8"){
      e.preventDefault();
      const idx = parseInt(k) - 1;
      if(TOPICS[idx]){ state.view="topic"; state.topicIdx=idx; state.tab="learn"; render(); }
    }
    else if(k === "f"){ e.preventDefault(); state.view="flashcards"; render(); }
    else if(k === "g"){ e.preventDefault(); state.view="glossary"; render(); }
    else if(k === "c"){ e.preventDefault(); state.view="cbt"; render(); }
    else if(k === "a"){ e.preventDefault(); openA11yModal(); }
    else if(k === "t"){
      e.preventDefault();
      const themes = ["light", "dark", "sepia", "contrast"];
      const cur = state.a11y.theme || state.theme || "light";
      const next = themes[(themes.indexOf(cur) + 1) % themes.length];
      state.a11y.theme = next;
      state.theme = next;
      applyA11ySettings();
      saveState();
    }
    else if(k === "r"){
      e.preventDefault();
      if(speechState.isSpeaking){ stopSpeaking(); }
      else {
        const topReadBtn = document.getElementById("topReadBtn") || document.getElementById("readNoteBtn");
        if(topReadBtn) topReadBtn.click();
      }
    }
  }
  // Flashcard Space flip & arrow navigation
  if(state.view === "flashcards" && !isInput){
    if(e.key === " "){
      e.preventDefault();
      const card = document.getElementById("fcCard");
      if(card) card.click();
    } else if(e.key === "ArrowLeft"){
      e.preventDefault();
      const prev = document.getElementById("fcPrev");
      if(prev) prev.click();
    } else if(e.key === "ArrowRight"){
      e.preventDefault();
      const next = document.getElementById("fcNext");
      if(next) next.click();
    }
  }
  // CBT arrow navigation
  if(state.view === "cbt" && cbtSession && !cbtSession.submitted && !isInput){
    if(e.key === "ArrowLeft"){
      e.preventDefault();
      const prev = document.getElementById("cbtPrev");
      if(prev) prev.click();
    } else if(e.key === "ArrowRight"){
      e.preventDefault();
      const next = document.getElementById("cbtNext");
      if(next) next.click();
    }
  }
});

/* ============================================================
   INITIALIZATION
   ============================================================ */
loadSavedState();
initA11yGlobal();
render();
</script>
</body>
</html>
