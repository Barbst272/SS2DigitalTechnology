/* ============================================================
   SPREADSHEET FORMULA ENGINE (real Excel-style evaluator)
   ============================================================ */
function colToIdx(col){ let idx=0; for(const ch of col){ idx = idx*26 + (ch.charCodeAt(0)-64); } return idx-1; }
function idxToCol(idx){ let s=""; idx=idx+1; while(idx>0){ let rem=(idx-1)%26; s=String.fromCharCode(65+rem)+s; idx=Math.floor((idx-1)/26);} return s; }
function getRangeCells(range){
  const parts = range.split(":").map(s=>s.trim());
  const sMatch = parts[0].match(/([A-Z]+)(\d+)/), eMatch = (parts[1]||parts[0]).match(/([A-Z]+)(\d+)/);
  const scIdx = colToIdx(sMatch[1]), sr = parseInt(sMatch[2]);
  const ecIdx = colToIdx(eMatch[1]), er = parseInt(eMatch[2]);
  let cells=[];
  for(let r=Math.min(sr,er); r<=Math.max(sr,er); r++){
    for(let c=Math.min(scIdx,ecIdx); c<=Math.max(scIdx,ecIdx); c++){ cells.push(idxToCol(c)+r); }
  }
  return cells;
}
function splitTopLevelArgs(s){
  let args=[], depth=0, cur="", inQuote=false;
  for(let ch of s){
    if(ch === '"'){ inQuote=!inQuote; cur+=ch; continue; }
    if(ch==='(' && !inQuote) depth++;
    if(ch===')' && !inQuote) depth--;
    if(ch===',' && depth===0 && !inQuote){ args.push(cur); cur=""; continue; }
    cur+=ch;
  }
  args.push(cur);
  return args.map(a=>a.trim());
}
function cellDisplay(ref, cells, depth){
  depth = depth||0; if(depth>8) return "#REF!";
  const raw = cells[ref];
  if(raw===undefined || raw===null || raw==="") return "";
  if(typeof raw === "string" && raw.trim().startsWith("=")){
    try{ return evalFormula(raw.trim().slice(1), cells, depth+1); } catch(e){ return "#ERR"; }
  }
  return raw;
}
function cellNum(ref, cells, depth){
  const v = cellDisplay(ref, cells, depth);
  if(v === "" || v===undefined) return 0;
  const n = parseFloat(v); return isNaN(n) ? 0 : n;
}
function resolveLiteralOrFormula(str, cells, depth){
  str = str.trim();
  if(str.startsWith('"') && str.endsWith('"')) return str.slice(1,-1);
  if(/^-?\d+(\.\d+)?$/.test(str)) return parseFloat(str);
  if(/^[A-Z]+\d+$/.test(str)) return cellDisplay(str, cells, depth+1);
  return evalFormula(str, cells, depth+1);
}
function substituteCellsNumeric(expr, cells, depth){
  return expr.replace(/\b([A-Z]+)(\d{1,3})\b/g, (m)=>{
    const v = cellDisplay(m, cells, depth+1);
    if(v === "") return "0";
    const n = parseFloat(v);
    return isNaN(n) ? JSON.stringify(String(v)) : String(n);
  });
}
function safeEval(expr){
  if(!/^[0-9+\-*/.()<>=!&|," A-Za-z_]*$/.test(expr)) throw new Error("bad expr");
  return Function('"use strict"; return (' + expr + ')')();
}
function evalFormula(expr, cells, depth){
  depth = depth || 0; if(depth>12) return "#REF!";
  expr = expr.trim();
  const fnMatch = expr.match(/^([A-Z]+)\((.*)\)$/is);
  if(fnMatch){
    const fname = fnMatch[1].toUpperCase(); const inner = fnMatch[2];
    if(fname === "IF"){
      const args = splitTopLevelArgs(inner);
      const condResult = safeEval(substituteCellsNumeric(args[0], cells, depth));
      return resolveLiteralOrFormula(condResult ? args[1] : args[2], cells, depth);
    }
    if(fname === "SUM"){ return getRangeCells(inner).reduce((s,ref)=>s+cellNum(ref,cells,depth+1),0); }
    if(fname === "AVERAGE"){ const r=getRangeCells(inner).map(ref=>cellNum(ref,cells,depth+1)); return r.length? r.reduce((a,b)=>a+b,0)/r.length : 0; }
    if(fname === "COUNT"){ return getRangeCells(inner).filter(ref=>cellDisplay(ref,cells,depth+1)!=="").length; }
    if(fname === "SUMIF"){
      const args = splitTopLevelArgs(inner);
      const range = getRangeCells(args[0]);
      const criteria = String(resolveLiteralOrFormula(args[1],cells,depth)).trim().toLowerCase();
      const sumRange = getRangeCells(args[2]);
      let total=0;
      range.forEach((ref,i)=>{ if(String(cellDisplay(ref,cells,depth+1)).trim().toLowerCase()===criteria) total += cellNum(sumRange[i],cells,depth+1); });
      return total;
    }
    if(fname === "COUNTIF"){
      const args = splitTopLevelArgs(inner);
      const range = getRangeCells(args[0]);
      const criteria = String(resolveLiteralOrFormula(args[1],cells,depth)).trim().toLowerCase();
      return range.filter(ref=>String(cellDisplay(ref,cells,depth+1)).trim().toLowerCase()===criteria).length;
    }
    if(fname === "VLOOKUP"){
      const args = splitTopLevelArgs(inner);
      const lookupVal = String(resolveLiteralOrFormula(args[0],cells,depth)).trim().toLowerCase();
      const rangeArg = args[1]; const colIdx = parseInt(resolveLiteralOrFormula(args[2],cells,depth));
      const startRef = rangeArg.split(":")[0].trim();
      const startColLetters = startRef.match(/[A-Z]+/)[0]; const startColIdx = colToIdx(startColLetters);
      const range = getRangeCells(rangeArg);
      const rows = [...new Set(range.map(r=>r.match(/\d+/)[0]))];
      for(const rowNum of rows){
        const firstVal = String(cellDisplay(startColLetters+rowNum, cells, depth+1)).trim().toLowerCase();
        if(firstVal === lookupVal){ return cellDisplay(idxToCol(startColIdx+colIdx-1)+rowNum, cells, depth+1); }
      }
      return "#N/A";
    }
    return "#NAME?";
  }
  try{ return safeEval(substituteCellsNumeric(expr, cells, depth)); } catch(e){ return "#ERR"; }
}

/* Reusable spreadsheet-grid widget. cells = {A1:'...', ...}. cols/rows = counts. onEdit optional callback */
function renderSheet(container, cells, cols, rows, opts){
  opts = opts || {};
  let sel = opts.initialSel || "A1";
  const styles = opts.styles || {};
  const wrap = document.createElement("div");
  const fb = document.createElement("div"); fb.className = "formula-bar";
  fb.innerHTML = `<div class="name-box" id="fbName">${sel}</div><input type="color" id="fbColor" title="Font colour" style="width:26px;height:24px;border:1px solid var(--border-light);border-radius:4px;padding:1px;cursor:pointer;flex:none;"><input type="text" id="fbInput" placeholder="Enter a value or formula, e.g. =SUM(A1:A3)">`;
  wrap.appendChild(fb);
  const sheetWrap = document.createElement("div"); sheetWrap.className = "sheet-wrap";
  const table = document.createElement("table"); table.className = "sheet";
  let thead = "<tr><th class='rownum'></th>"; for(let c=0;c<cols;c++) thead += `<th>${idxToCol(c)}</th>`; thead += "</tr>";
  let body = "";
  for(let r=1;r<=rows;r++){
    body += `<tr><td class="rownum">${r}</td>`;
    for(let c=0;c<cols;c++){ const ref = idxToCol(c)+r; body += `<td data-ref="${ref}"><input readonly value="${cellDisplay(ref,cells)}" style="color:${styles[ref]||''}"></td>`; }
    body += "</tr>";
  }
  table.innerHTML = thead + body;
  sheetWrap.appendChild(table); wrap.appendChild(sheetWrap);
  container.appendChild(wrap);

  const fbInput = fb.querySelector("#fbInput"), fbName = fb.querySelector("#fbName"), fbColor = fb.querySelector("#fbColor");
  function selectCell(ref){
    table.querySelectorAll("td.sel").forEach(td=>td.classList.remove("sel"));
    const td = table.querySelector(`td[data-ref="${ref}"]`);
    if(td) td.classList.add("sel");
    sel = ref; fbName.textContent = ref;
    fbInput.value = cells[ref]!==undefined ? cells[ref] : "";
    fbColor.value = styles[ref] || "#1d2029";
    fbInput.focus();
  }
  function recalcAll(){
    table.querySelectorAll("td[data-ref]").forEach(td=>{
      const ref = td.dataset.ref;
      const inp = td.querySelector("input");
      inp.value = cellDisplay(ref, cells);
      inp.style.color = styles[ref] || "";
    });
    if(opts.onChange) opts.onChange(cells);
  }
  table.querySelectorAll("td[data-ref]").forEach(td=>{
    td.addEventListener("click",()=>selectCell(td.dataset.ref));
  });
  fbInput.addEventListener("keydown",(e)=>{
    if(e.key==="Enter"){
      cells[sel] = fbInput.value;
      recalcAll();
      const rowNum = parseInt(sel.match(/\d+/)[0]);
      const colLetters = sel.match(/[A-Z]+/)[0];
      if(rowNum < rows) selectCell(colLetters + (rowNum+1));
    }
  });
  fbInput.addEventListener("blur",()=>{ cells[sel] = fbInput.value; recalcAll(); });
  fbColor.addEventListener("input",()=>{ styles[sel] = fbColor.value; recalcAll(); });
  selectCell(sel);
  recalcAll();
  return { recalcAll, selectCell, cells, styles };
}

function simFoundations(content, mode){
  if(mode==="simulate"){
    const el = labShell(content,"DataLab.exe","Text ⇄ Binary ⇄ ASCII ⇄ Colour",
      `<div class="field"><label>Type a word or short phrase</label><input type="text" id="binIn" value="SS2"></div>
       <div class="out-box" id="binOut"></div>
       <div class="hint">Now try the RGB mixer — this is exactly how a pixel's colour is stored as three bytes.</div>
       <div class="field-row" style="margin-top:14px;">
        <div class="field"><label>Red: <span id="rV">120</span></label><input type="range" id="rR" min="0" max="255" value="120"></div>
        <div class="field"><label>Green: <span id="gV">180</span></label><input type="range" id="gR" min="0" max="255" value="180"></div>
        <div class="field"><label>Blue: <span id="bV">90</span></label><input type="range" id="bR" min="0" max="255" value="90"></div>
       </div>
       <div style="display:flex;gap:16px;align-items:center;">
        <div id="swatch" style="width:70px;height:70px;border-radius:10px;border:1px solid var(--border-light);"></div>
        <div class="out-box" id="rgbOut" style="flex:1;margin-top:0;"></div>
       </div>`);
    const inp = el.querySelector("#binIn"), out = el.querySelector("#binOut");
    function update(){
      const txt = inp.value.slice(0,12);
      if(!txt){ out.textContent = "Type something above..."; return; }
      let lines = [...txt].map(ch=>{
        const code = ch.charCodeAt(0); const bin = code.toString(2).padStart(8,"0");
        return `'${ch}'  →  ASCII <span class="k">${code}</span>  →  binary <span class="k">${bin}</span>`;
      });
      out.innerHTML = lines.join("\n") + `\n\nTotal size: <span class="k">${txt.length} bytes</span> (${txt.length*8} bits)`;
    }
    inp.addEventListener("input",update); update();
    const rR=el.querySelector("#rR"), gR=el.querySelector("#gR"), bR=el.querySelector("#bR");
    function updateRGB(){
      const r=+rR.value,g=+gR.value,b=+bR.value;
      el.querySelector("#rV").textContent=r; el.querySelector("#gV").textContent=g; el.querySelector("#bV").textContent=b;
      const hex = "#"+[r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("");
      el.querySelector("#swatch").style.background = hex;
      el.querySelector("#rgbOut").innerHTML = `R = ${r} = binary <span class="k">${r.toString(2).padStart(8,"0")}</span>\nG = ${g} = binary <span class="k">${g.toString(2).padStart(8,"0")}</span>\nB = ${b} = binary <span class="k">${b.toString(2).padStart(8,"0")}</span>\n\nHex colour code: <span class="k">${hex}</span>  (3 bytes = 24-bit colour)`;
    }
    [rR,gR,bR].forEach(r=>r.addEventListener("input",updateRGB)); updateRGB();
  } else {
    const el = labShell(content,"NetworkLab.exe","Build a LAN, assign IPs, ping devices & resolve DNS",
      `<div class="lab-toolbar">
        <button class="tbtn" id="addPc">+ Add PC</button>
        <button class="tbtn" id="addLaptop">+ Add Laptop</button>
        <button class="tbtn" id="addPhone">+ Add Phone</button>
       </div>
       <div style="padding:16px 0;">
        <div class="device-row" id="deviceRow"></div>
        <div class="field-row">
          <div class="field"><label>Ping from</label><select id="pingFrom"></select></div>
          <div class="field"><label>Ping to</label><select id="pingTo"></select></div>
          <div class="field" style="display:flex;align-items:flex-end;"><button class="mini-btn" id="pingBtn">Ping</button></div>
        </div>
        <div class="out-box" id="pingOut">No ping sent yet.</div>
        <div class="field-row" style="margin-top:18px;">
          <div class="field"><label>DNS lookup — type a domain</label><input type="text" id="dnsIn" value="google.com"></div>

        </div>
        <div class="out-box" id="dnsOut">Router (default gateway) 192.168.1.1</div>
       </div>`);
    let devices = [{name:"Router",ip:"192.168.1.1",type:"router"}];
    let nextHost = 2;
    const row = el.querySelector("#deviceRow"), fromSel = el.querySelector("#pingFrom"), toSel = el.querySelector("#pingTo");
    function draw(){
      row.innerHTML = devices.map(d=>`<div class="device-card">${d.type==='router'?'📡':d.type==='pc'?'🖥️':d.type==='laptop'?'💻':'📱'} ${d.name}<div class="ip">${d.ip}</div></div>`).join("");
      const opts = devices.map(d=>`<option value="${d.ip}">${d.name} (${d.ip})</option>`).join("");
      fromSel.innerHTML = opts; toSel.innerHTML = opts;
      if(devices.length>1) toSel.selectedIndex = 1;
    }
    function addDevice(type,label){
      const ip = "192.168.1."+nextHost; nextHost++;
      devices.push({name:label+" "+(devices.filter(d=>d.type===type).length+1), ip, type});
      draw();
    }
    el.querySelector("#addPc").addEventListener("click",()=>addDevice("pc","PC"));
    el.querySelector("#addLaptop").addEventListener("click",()=>addDevice("laptop","Laptop"));
    el.querySelector("#addPhone").addEventListener("click",()=>addDevice("phone","Phone"));
    el.querySelector("#pingBtn").addEventListener("click",()=>{
      const from = fromSel.value, to = toSel.value;
      const out = el.querySelector("#pingOut");
      if(from===to){ out.textContent = "Source and destination are the same device."; return; }
      const times = [1,2,1,3].map(t=>t+Math.floor(Math.random()*2));
      out.textContent = `Pinging ${to} from ${from}:\n` + times.map(t=>`Reply from ${to}: bytes=32 time=${t}ms TTL=64`).join("\n") + `\n\nPing statistics: Sent=4, Received=4, Lost=0 (0% loss) — both devices are on the same LAN.`;
    });
    el.querySelector("#dnsBtn").addEventListener("click",()=>{
      const domain = el.querySelector("#dnsIn").value.trim().toLowerCase();
      const table = {"google.com":"142.250.66.78","whogohost.com":"197.210.226.16","facebook.com":"157.240.12.35","youtube.com":"142.250.66.238"};
      const out = el.querySelector("#dnsOut");
      if(table[domain]) out.textContent = `Non-authoritative answer:\nName:    ${domain}\nAddress: ${table[domain]}`;
      else out.textContent = `DNS lookup failed for "${domain}" — this domain is not in our resolver's records (try google.com, whogohost.com, facebook.com or youtube.com).`;
    });
    draw();
  }
}

let mmTemplate = "Dear <<First_Name>> <<Last_Name>>,\n\nThis is a reminder that your outstanding fee balance is N<<Fee>>. Kindly settle this at the bursary before the end of term.\n\nRegards,\nThe Bursary";

function simMailMerge(content, mode){

    }
    function mergeFor(row){
      return mmTemplate.replace(/<<First_Name>>/g,row.First_Name).replace(/<<Last_Name>>/g,row.Last_Name).replace(/<<Fee>>/g,row.Outstanding_Fee);
    }
    function drawBody(){

        body.innerHTML = `<p style="font-size:13.5px;color:#5c5745;">Your data source (recipient list). Edit any cell — add a row for a new recipient.</p>
          <table class="grid-table" id="mmTable" style="width:100%;border-collapse:collapse;font-size:12.5px;">
            <tr><th>First_Name</th><th>Last_Name</th><th>Outstanding_Fee</th></tr>
            ${mmData.map((r,i)=>`<tr>

        body.querySelector("#addRow").addEventListener("click",()=>{ mmData.push({First_Name:"New",Last_Name:"Student",Outstanding_Fee:"0"}); drawBody(); });
      } else if(wizStep===2){
        body.innerHTML = `<p style="font-size:13.5px;color:#5c5745;">Write your letter. Click a field to insert it at the cursor.</p>
          <div class="lab-toolbar" id="fieldBtns" style="border-radius:6px;margin-bottom:8px;">
            ${["First_Name","Last_Name","Fee"].map(f=>`<button class="tbtn" data-f="${f}">Insert «${f}»</button>`).join("")}

        const box = body.querySelector("#mmTplBox");

        body.querySelectorAll("#fieldBtns .tbtn").forEach(b=>b.addEventListener("click",()=>{
          const tag = `<<${b.dataset.f}>>`;
          const start = box.selectionStart, end = box.selectionEnd;
          box.value = box.value.slice(0,start)+tag+box.value.slice(end);
          mmTemplate = box.value;
          box.focus(); box.selectionStart=box.selectionEnd=start+tag.length;
        }));
      } else if(wizStep===3){
        previewIdx = Math.min(previewIdx, mmData.length-1);
        body.innerHTML = `<p style="font-size:13.5px;color:#5c5745;">Recipient ${previewIdx+1} of ${mmData.length}</p>
          <div style="display:flex;gap:8px;margin-bottom:10px;">

    el.querySelector("#wizBack").addEventListener("click",()=>{ if(wizStep>0){ wizStep--; drawNav(); drawBody(); } });

      if(wizStep<steps.length-1){ wizStep++; drawNav(); drawBody(); el.querySelector("#wizNext").textContent = wizStep===steps.length-1 ? "Finish merge" : "Next"; }
    });
    drawNav(); drawBody();
  } else {
    const el = labShell(content,"MacroRecorder.exe","Record real formatting actions, then replay them with one click",
      `<div class="field"><label>Sample paragraph (this is what you'll format)</label>
        <div id="macroTarget" contenteditable="true" style="border:1px solid var(--border-light);border-radius:8px;padding:14px;min-height:70px;font-size:14px;background:#fff;">The annual school sports day will hold on the third Saturday of next month. All students are to report to the field by 8am in their house colours.</div>
       </div>
       <div class="lab-toolbar" id="macroToolbar" style="border-radius:6px;margin:12px 0;">
        <select id="mFont"><option>Arial</option><option>Times New Roman</option><option>Calibri</option></select>
        <select id="mSize"><option>12</option><option>14</option><option>18</option><option>24</option></select>
        <button class="tbtn" id="mBold"><b>B</b></button>
        <button class="tbtn" id="mCenter">↔ Center</button>
       </div>
       <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;">
        <button class="mini-btn" id="recBtn">● Record Macro</button>
        <span class="badge" id="recBadge">Not recording</span>
       </div>
       <div class="out-box" id="macroLog">No actions recorded yet.</div>
       <div class="field" style="margin-top:14px;"><label>New paragraph to test the macro on</label>
        <div id="macroApplyTarget" contenteditable="true" style="border:1px solid var(--border-light);border-radius:8px;padding:14px;min-height:60px;font-size:14px;background:#fff;">Inter-house sports practice begins this Monday after closing hours.</div>
       </div>
       <button class="mini-btn" id="runMacroBtn" disabled style="margin-top:10px;">▶ Run Macro (Alt+H)</button>`);
    let recording = false, actions = [];
    const target = el.querySelector("#macroTarget");
    function log(text){ actions.push(text); el.querySelector("#macroLog").innerHTML = actions.length ? actions.map((a,i)=>`${i+1}. ${a}`).join("\n") : "No actions recorded yet."; }
    el.querySelector("#recBtn").addEventListener("click",()=>{
      recording = !recording; actions = [];
      el.querySelector("#recBadge").textContent = recording ? "● Recording..." : "Not recording";
      el.querySelector("#recBadge").className = "badge " + (recording ? "warn" : "");
      el.querySelector("#recBtn").textContent = recording ? "■ Stop Recording" : "● Record Macro";
      if(!recording && actions.length){ el.querySelector("#runMacroBtn").disabled = false; }
      if(recording) log("Recording started...");
    });
    el.querySelector("#mFont").addEventListener("change",e=>{ target.style.fontFamily = e.target.value; if(recording) log(`Set font to "${e.target.value}"`); });
    el.querySelector("#mSize").addEventListener("change",e=>{ target.style.fontSize = e.target.value+"px"; if(recording) log(`Set font size to ${e.target.value}`); });
    el.querySelector("#mBold").addEventListener("click",()=>{ const on = target.style.fontWeight==="bold"; target.style.fontWeight = on?"normal":"bold"; if(recording) log(`Bold ${on?"OFF":"ON"}`); });
    el.querySelector("#mCenter").addEventListener("click",()=>{ const on = target.style.textAlign==="center"; target.style.textAlign = on?"left":"center"; if(recording) log(`Alignment set to ${on?"Left":"Center"}`); });
    el.querySelector("#runMacroBtn").addEventListener("click",()=>{
      const apply = el.querySelector("#macroApplyTarget");
      const realActions = actions.filter(a=>a!=="Recording started...");
      let i = 0;
      function step(){
        if(i>=realActions.length) return;
        const a = realActions[i];
        if(a.startsWith("Set font to")) apply.style.fontFamily = a.match(/"(.+)"/)[1];
        else if(a.startsWith("Set font size to")) apply.style.fontSize = a.match(/\d+/)[0]+"px";
        else if(a.startsWith("Bold")) apply.style.fontWeight = a.includes("ON") ? "bold":"normal";
        else if(a.startsWith("Alignment")) apply.style.textAlign = a.includes("Center") ? "center":"left";
        i++; setTimeout(step, 300);
      }
      step();
    });
  }
}

       <div id="sheetHost"></div>`);
    const cells = {
      A1:"Region",B1:"Product",C1:"Amount",
      A2:"Lagos",B2:"Electronics",C2:"45000",
      A3:"Abuja",B3:"Furniture",C3:"32000",
      A4:"Lagos",B4:"Furniture",C4:"18000",
      A5:"Kano",B5:"Electronics",C5:"27000",
      A6:"Abuja",B6:"Electronics",C6:"51000",

      E1:"=SUM(C2:C7)"

    renderSheet(el.querySelector("#sheetHost"), cells, 6, 10, {});
  } else {
    const rows = [
      {Region:"Lagos",Product:"Electronics",Amount:45000},{Region:"Abuja",Product:"Furniture",Amount:32000},
      {Region:"Lagos",Product:"Furniture",Amount:18000},{Region:"Kano",Product:"Electronics",Amount:27000},
      {Region:"Abuja",Product:"Electronics",Amount:51000},{Region:"Lagos",Product:"Electronics",Amount:12000},
      {Region:"Kano",Product:"Furniture",Amount:9000}
    ];
    const el = labShell(content,"PivotTable — insert","Drag fields into Rows and Values, exactly like Excel's pivot builder",
      `<div class="dnd-row">
        <div class="field-pool" id="fieldPool">
          <div class="hint" style="margin:0 0 4px;">Fields</div>
          <div class="drag-pill" draggable="true" data-f="Region">Region</div>
          <div class="drag-pill" draggable="true" data-f="Product">Product</div>
          <div class="drag-pill" draggable="true" data-f="Amount">Amount</div>
        </div>
        <div class="dropzone" data-zone="rows"><div class="dz-label">Rows</div><div class="dz-body"></div></div>
        <div class="dropzone" data-zone="values"><div class="dz-label">Values</div><div class="dz-body"></div></div>
       </div>
       <div class="out-box" id="pivotOut" style="margin-top:16px;">Drag "Region" into Rows and "Amount" into Values to build your first pivot table.</div>`);
    let zones = {rows:null, values:null};
    el.querySelectorAll(".drag-pill").forEach(p=>{
      p.addEventListener("dragstart",e=>{ e.dataTransfer.setData("text/plain", p.dataset.f); });
    });
    el.querySelectorAll(".dropzone").forEach(z=>{
      z.addEventListener("dragover",e=>{ e.preventDefault(); z.classList.add("over"); });
      z.addEventListener("dragleave",()=>z.classList.remove("over"));
      z.addEventListener("drop",e=>{
        e.preventDefault(); z.classList.remove("over");
        const f = e.dataTransfer.getData("text/plain");
        zones[z.dataset.zone] = f;
        renderZones(); computePivot();
      });
    });
    function renderZones(){
      el.querySelectorAll(".dropzone").forEach(z=>{
        const f = zones[z.dataset.zone];
        z.querySelector(".dz-body").innerHTML = f ? `<div class="dropped-pill">${f}<span class="x" data-zone="${z.dataset.zone}">✕</span></div>` : "";
      });
      el.querySelectorAll(".dropped-pill .x").forEach(x=>x.addEventListener("click",()=>{ zones[x.dataset.zone]=null; renderZones(); computePivot(); }));
    }
    function computePivot(){
      const out = el.querySelector("#pivotOut");
      if(!zones.rows || !zones.values){ out.textContent = "Drag a field into Rows and a numeric field into Values to build your pivot table."; return; }
      const groups = {};
      rows.forEach(r=>{ const key = r[zones.rows]; groups[key] = (groups[key]||0) + (zones.values==="Amount" ? r.Amount : 1); });
      let txt = `${zones.rows} → Sum of ${zones.values}\n\n` + Object.entries(groups).map(([k,v])=>`${String(k).padEnd(14)} ${zones.values==="Amount" ? "₦"+v.toLocaleString() : v}`).join("\n");
      const total = Object.values(groups).reduce((a,b)=>a+b,0);
      txt += `\n${"Grand Total".padEnd(14)} ${zones.values==="Amount" ? "₦"+total.toLocaleString() : total}`;
      out.innerHTML = `<span class="k">${txt.split("\n")[0]}</span>\n\n` + txt.split("\n").slice(1).join("\n");
    }
    renderZones();
  }
}

let bakery = { price:1000, cost:400, units:500, rent:50000, salary:80000 };
let scenarios = [
  {name:"Worst Case", price:800, units:300},
  {name:"Best Case", price:1200, units:700}
];
function bakeryCalc(a){
  const revenue = a.price*a.units, cogs = a.cost*a.units, fixed = a.rent+a.salary;
  return { revenue, cogs, fixed, profit: revenue-cogs-fixed };
}
function simFinance(content, mode){
  if(mode==="simulate"){
    const el = labShell(content,"BakeryModel.xlsx","Assumptions-driven model + Scenario Manager",
      `<div class="split">
        <div>
          <div class="hint" style="margin-bottom:6px;">ASSUMPTIONS</div>
          <div class="field"><label>Price per Loaf (₦) — B1</label><input type="number" id="mPrice"></div>
          <div class="field"><label>Cost per Loaf (₦) — B2</label><input type="number" id="mCost"></div>
          <div class="field"><label>Loaves Sold / Month — B3</label><input type="number" id="mUnits"></div>
          <div class="field"><label>Monthly Rent (₦) — B4</label><input type="number" id="mRent"></div>
          <div class="field"><label>Monthly Staff Salary (₦) — B5</label><input type="number" id="mSalary"></div>
        </div>
        <div>
          <div class="hint" style="margin-bottom:6px;">CALCULATIONS</div>
          <div class="out-box" id="calcOut"></div>
        </div>
       </div>
       <div style="margin-top:18px;">
        <div class="hint" style="margin-bottom:6px;">SCENARIO MANAGER</div>
        <div id="scenList"></div>
        <div class="field-row" style="margin-top:8px;">
          <div class="field"><label>New scenario name</label><input type="text" id="scName" placeholder="e.g. Rainy Season"></div>
          <div class="field"><label>Price (changing cell)</label><input type="number" id="scPrice"></div>
          <div class="field"><label>Units (changing cell)</label><input type="number" id="scUnits"></div>
          <div class="field" style="display:flex;align-items:flex-end;"><button class="mini-btn" id="scAdd">+ Add Scenario</button></div>
        </div>
       </div>`);
    const ids = {mPrice:"price",mCost:"cost",mUnits:"units",mRent:"rent",mSalary:"salary"};
    Object.keys(ids).forEach(id=>{ el.querySelector("#"+id).value = bakery[ids[id]]; });
    function updateCalc(){
      const c = bakeryCalc(bakery);
      el.querySelector("#calcOut").innerHTML =
        `Revenue        =B1*B3 = <span class="k">₦${c.revenue.toLocaleString()}</span>\nCost of Loaves =B2*B3 = <span class="k">₦${c.cogs.toLocaleString()}</span>\nFixed Costs    =B4+B5 = <span class="k">₦${c.fixed.toLocaleString()}</span>\n\nNET PROFIT     =Revenue−Cost−Fixed\n               = <span class="k">₦${c.profit.toLocaleString()}</span>`;
    }
    Object.keys(ids).forEach(id=> el.querySelector("#"+id).addEventListener("input",e=>{ bakery[ids[id]] = +e.target.value||0; updateCalc(); }));
    function drawScenarios(){
      el.querySelector("#scenList").innerHTML = scenarios.map((s,i)=>`
        <div class="dropped-pill" style="background:var(--paper-dim);color:#1D2029;">
          <span><strong>${s.name}</strong> — Price ₦${s.price}, Units ${s.units}</span>
          <button class="tbtn" data-i="${i}" style="margin-left:8px;">Apply</button>
        </div>`).join("");
      el.querySelectorAll("#scenList .tbtn").forEach(b=>b.addEventListener("click",()=>{
        const s = scenarios[b.dataset.i]; bakery.price=s.price; bakery.units=s.units;
        el.querySelector("#mPrice").value=s.price; el.querySelector("#mUnits").value=s.units;
        updateCalc();
      }));
    }
    el.querySelector("#scAdd").addEventListener("click",()=>{
      const name = el.querySelector("#scName").value.trim() || "Scenario "+(scenarios.length+1);
      const price = +el.querySelector("#scPrice").value || bakery.price;
      const units = +el.querySelector("#scUnits").value || bakery.units;
      scenarios.push({name, price, units});
      el.querySelector("#scName").value=""; el.querySelector("#scPrice").value=""; el.querySelector("#scUnits").value="";
      drawScenarios();
    });
    drawScenarios(); updateCalc();
  } else {
    const el = labShell(content,"GoalSeek","Data → What-If Analysis → Goal Seek",
      `<div class="field-row">
        <div class="field"><label>Set cell</label><select id="gsSet"><option>Net Profit</option></select></div>
        <div class="field"><label>To value (₦)</label><input type="number" id="gsTarget" value="150000"></div>
        <div class="field"><label>By changing cell</label><select id="gsChange"><option value="units">Loaves Sold (B3)</option><option value="price">Price per Loaf (B1)</option></select></div>
       </div>
       <button class="mini-btn" id="gsRun">Run Goal Seek</button>
       <div class="out-box" id="gsOut" style="margin-top:14px;">Current model: Price ₦${bakery.price}, Units ${bakery.units}, Net Profit ₦${bakeryCalc(bakery).profit.toLocaleString()}</div>`);
    el.querySelector("#gsRun").addEventListener("click",()=>{
      const target = +el.querySelector("#gsTarget").value || 0;
      const changing = el.querySelector("#gsChange").value;
      const out = el.querySelector("#gsOut");
      let solved, ok=true;
      if(changing==="units"){
        const margin = bakery.price - bakery.cost;
        if(margin<=0){ ok=false; } else { solved = Math.ceil((target + bakery.rent + bakery.salary)/margin); }
      } else {
        if(bakery.units<=0){ ok=false; } else { solved = ((target + bakery.rent + bakery.salary)/bakery.units) + bakery.cost; solved = Math.round(solved); }
      }
      if(!ok){ out.textContent = "Goal Seek cannot find a solution with the current assumptions."; return; }
      let guess = changing==="units" ? bakery.units : bakery.price;
      const steps = 8; let i=0;
      out.textContent = "Seeking a solution...";
      const iv = setInterval(()=>{
        i++;
        const frac = i/steps;
        const cur = Math.round(guess + (solved-guess)*frac);
        out.innerHTML = `Iteration ${i}/${steps} — trying ${changing==="units"?"Loaves Sold":"Price"} = <span class="k">${cur}</span>...`;
        if(i>=steps){
          clearInterval(iv);
          if(changing==="units"){ bakery.units = solved; } else { bakery.price = solved; }
          const c = bakeryCalc(bakery);
          out.innerHTML = `Goal Seek found a solution:\n\n${changing==="units"?"Loaves Sold":"Price per Loaf"} = <span class="k">${solved.toLocaleString()}</span>\n\nResulting Net Profit = <span class="k">₦${c.profit.toLocaleString()}</span> (target was ₦${target.toLocaleString()})\n\nThis value has been written back into your model — check the Simulate tab.`;
        }
      }, 220);
    });
  }
}

let deck = [
  {title:"Our Quarterly Results", bullets:[{text:"Revenue grew 18% this quarter.",reveal:true},{text:"Costs remained flat year-over-year.",reveal:true},{text:"New branch opens next month.",reveal:false}]},
  {title:"Next Steps", bullets:[{text:"Finalise the new branch budget.",reveal:false},{text:"Hire two new staff.",reveal:false}]}
];
let master = { logo:false, logoText:"MY BRAND", pageNum:false };

function renderSlideBox(box, slide, idx, total, masterOverride){
  const m = masterOverride || master;
  box.innerHTML = "";
  if(m.logo) box.insertAdjacentHTML("beforeend", `<div class="logo">● ${m.logoText}</div>`);
  const title = document.createElement("div");
  title.style.cssText = `font-weight:700;font-size:20px;margin-bottom:14px;color:${slide.color||'#222'};`;
  title.textContent = slide.title;
  box.appendChild(title);
  slide.bullets.forEach(b=>{
    const p = document.createElement("div");
    p.style.cssText = `font-size:13px;margin-bottom:6px;color:${slide.color||'#444'};`;
    p.textContent = "• " + b.text;
    box.appendChild(p);
  });
  if(m.pageNum) box.insertAdjacentHTML("beforeend", `<div class="pagenum">${idx+1} / ${total}</div>`);
}

    el.querySelector("#slTitle").addEventListener("input",e=>{ deck[activeIdx].title = e.target.value; drawList(); drawPreview(); });
    el.querySelector("#slBullets").addEventListener("input",e=>{

      deck[activeIdx].bullets = lines.map((l,i)=>({text:l, reveal: deck[activeIdx].bullets[i]?deck[activeIdx].bullets[i].reveal:false}));
      drawPreview();
    });
    el.querySelector("#addSlide").addEventListener("click",()=>{ deck.push({title:"New Slide",bullets:[{text:"First point",reveal:false}]}); activeIdx=deck.length-1; loadSlide(); });
    el.querySelector("#delSlide").addEventListener("click",()=>{ if(deck.length>1){ deck.splice(activeIdx,1); activeIdx=Math.max(0,activeIdx-1); loadSlide(); } });
    el.querySelector("#mLogo").checked = master.logo; el.querySelector("#mLogoText").value = master.logoText; el.querySelector("#mPage").checked = master.pageNum;
    el.querySelector("#mLogo").addEventListener("change",e=>{ master.logo=e.target.checked; drawPreview(); });

    el.querySelector("#mPage").addEventListener("change",e=>{ master.pageNum=e.target.checked; drawPreview(); });
    loadSlide();
  } else {
    let activeIdx = 0;
    const el = labShell(content,"AnimationPane + Present Mode","Set reveal-on-click per bullet, then run the slideshow",
      `<div class="field"><label>Editing slide</label><select id="slPick"></select></div>
       <div id="animBullets"></div>
       <button class="mini-btn" id="playBtn" style="margin-top:14px;">▶ Start Presentation</button>

          <span class="hint" id="presHint">Click "Reveal next" to show bullets one at a time.</span>
          <button class="tbtn" id="presNext">Reveal next ▶</button>
        </div>
       </div>`);
    const pick = el.querySelector("#slPick");
    pick.innerHTML = deck.map((s,i)=>`<option value="${i}">${i+1}. ${s.title}</option>`).join("");
    function drawBullets(){
      const s = deck[activeIdx];
      el.querySelector("#animBullets").innerHTML = s.bullets.map((b,i)=>`
        <div class="bullet-row">
          <span style="min-width:16px;">${i+1}</span>
          <input type="text" value="${b.text}" data-i="${i}" class="bText">
          <label style="font-size:11.5px;white-space:nowrap;"><input type="checkbox" data-i="${i}" class="bReveal" ${b.reveal?"checked":""}> reveal on click</label>
          <span class="mv" data-dir="-1" data-i="${i}">↑</span><span class="mv" data-dir="1" data-i="${i}">↓</span>
        </div>`).join("");
      el.querySelectorAll(".bText").forEach(inp=>inp.addEventListener("input",e=>{ s.bullets[e.target.dataset.i].text = e.target.value; }));
      el.querySelectorAll(".bReveal").forEach(cb=>cb.addEventListener("change",e=>{ s.bullets[e.target.dataset.i].reveal = e.target.checked; }));
      el.querySelectorAll(".mv").forEach(m=>m.addEventListener("click",()=>{
        const i = parseInt(m.dataset.i), dir = parseInt(m.dataset.dir), j = i+dir;
        if(j<0||j>=s.bullets.length) return;
        [s.bullets[i],s.bullets[j]] = [s.bullets[j],s.bullets[i]];
        drawBullets();
      }));
    }
    pick.addEventListener("change",()=>{ activeIdx = parseInt(pick.value); drawBullets(); });
    drawBullets();

    let presIdx = 0, revealCount = 0;
    function drawPresent(){
      const s = deck[presIdx];
      const box = el.querySelector("#presBox");
      const visibleBullets = s.bullets.filter((b,i)=> !b.reveal || i < revealCount);
      renderSlideBox(box, {title:s.title, bullets:visibleBullets}, presIdx, deck.length);
      const remaining = s.bullets.filter(b=>b.reveal).length - revealCount;
      el.querySelector("#presHint").textContent = remaining>0 ? `${remaining} bullet(s) still hidden — click Reveal next.` : "All bullets shown — click Reveal next to advance slide.";
    }
    el.querySelector("#playBtn").addEventListener("click",()=>{
      presIdx = 0; revealCount = 0;
      el.querySelector("#presentArea").style.display = "block";
      drawPresent();
    });
    el.querySelector("#presNext").addEventListener("click",()=>{
      const s = deck[presIdx];
      const revealTotal = s.bullets.filter(b=>b.reveal).length;
      if(revealCount < revealTotal){ revealCount++; }
      else if(presIdx < deck.length-1){ presIdx++; revealCount=0; }
      drawPresent();
    });
    el.querySelector("#presPrev").addEventListener("click",()=>{
      if(revealCount>0){ revealCount--; } else if(presIdx>0){ presIdx--; revealCount = deck[presIdx].bullets.filter(b=>b.reveal).length; }
      drawPresent();
    });
  }
}

}

      </div>`).join("");
    shell.querySelectorAll("[data-open]").forEach(s=>s.addEventListener("click",()=>{ activeExcelBook=parseInt(s.dataset.open); loadBook(); }));
    shell.querySelectorAll("[data-del]").forEach(s=>s.addEventListener("click",(e)=>{
      e.stopPropagation();
      const i = parseInt(s.dataset.del);
      excelBooks.splice(i,1);
      activeExcelBook = Math.max(0, activeExcelBook>=i ? activeExcelBook-1 : activeExcelBook);
      loadBook();
    }));
  }
  function drawSheetTabs(){
    const book = excelBooks[activeExcelBook];
    shell.querySelector("#sheetTabs").innerHTML = book.sheets.map((s,i)=>`<div class="sheet-tab ${i===book.activeSheet?'active':''}" data-i="${i}">${s.name}</div>`).join("");
    shell.querySelectorAll(".sheet-tab").forEach(t=>t.addEventListener("click",()=>{ book.activeSheet = parseInt(t.dataset.i); loadBook(); }));
  }
  function loadBook(){
    drawBookList(); drawSheetTabs();
    const book = excelBooks[activeExcelBook];
    const sheet = book.sheets[book.activeSheet];
    const host = shell.querySelector("#excelGridHost");
    host.innerHTML = "";
    renderSheet(host, sheet.cells, 8, 22, {styles: sheet.styles});
  }
  shell.querySelector("#excelNewBook").addEventListener("click",()=>{
    excelBooks.push({id:Date.now(), name:"Book"+(excelBooks.length+1), sheets:[{name:"Sheet1",cells:{},styles:{}}], activeSheet:0});
    activeExcelBook = excelBooks.length-1;
    loadBook();
  });
  shell.querySelector("#excelAddSheet").addEventListener("click",()=>{
    const book = excelBooks[activeExcelBook];
    book.sheets.push({name:"Sheet"+(book.sheets.length+1), cells:{}, styles:{}});
    book.activeSheet = book.sheets.length-1;
    loadBook();
  });
  shell.querySelector("#excelDownload").addEventListener("click",()=>{
    const book = excelBooks[activeExcelBook];
    const sheet = book.sheets[book.activeSheet];
    let csv = "";
    for(let r=1;r<=22;r++){
      let row = [];
      for(let c=0;c<8;c++){
        const ref = idxToCol(c)+r;
        let v = String(cellDisplay(ref, sheet.cells)||"");
        if(v.includes(",")||v.includes('"')) v = '"'+v.replace(/"/g,'""')+'"';
        row.push(v);
      }
      csv += row.join(",")+"\n";
    }
    downloadBlob(csv, sheet.name.replace(/[^a-z0-9]+/gi,"_")+".csv", "text/csv");
  });
  loadBook();
}

      <div class="office-doc ${i===activePptDeck?'active':''}" data-i="${i}">

    shell.querySelector("#pBullets").value = s.bullets.map(b=>b.text).join("\n");
    drawSlideList(); drawPreview();
  }
  function drawPreview(){ renderSlideBox(shell.querySelector("#pptPrev"), deck().slides[activeSlide], activeSlide, deck().slides.length, deck().master); }
  function loadDeck(){
    drawDeckList();
    shell.querySelector("#pLogo").checked = deck().master.logo;
    shell.querySelector("#pLogoText").value = deck().master.logoText;
    shell.querySelector("#pPage").checked = deck().master.pageNum;

  shell.querySelector("#pTitle").addEventListener("input",e=>{ deck().slides[activeSlide].title = e.target.value; drawSlideList(); drawPreview(); });
  shell.querySelector("#pColor").addEventListener("input",e=>{ deck().slides[activeSlide].color = e.target.value; drawPreview(); });
  shell.querySelector("#pBullets").addEventListener("input",e=>{
    const lines = e.target.value.split("\n").filter(l=>l.trim()!=="");
    deck().slides[activeSlide].bullets = lines.map((l,i)=>({text:l, reveal:false}));
    drawPreview();
  });
  shell.querySelector("#pptAddSlide").addEventListener("click",()=>{ deck().slides.push({title:"New Slide",bullets:[{text:"First point",reveal:false}]}); activeSlide=deck().slides.length-1; loadSlide(); });
  shell.querySelector("#pptDelSlide").addEventListener("click",()=>{ if(deck().slides.length>1){ deck().slides.splice(activeSlide,1); activeSlide=Math.max(0,activeSlide-1); loadSlide(); } });

    pptDecks.push({id:Date.now(), name:"Presentation"+(pptDecks.length+1), slides:[{title:"Click to add title",bullets:[{text:"Click to add text",reveal:false}]}], master:{logo:false,logoText:"MY BRAND",pageNum:false}});
    activePptDeck = pptDecks.length-1; activeSlide=0; loadDeck();
  });
  shell.querySelector("#pLogo").addEventListener("change",e=>{ deck().master.logo=e.target.checked; drawPreview(); });
  shell.querySelector("#pLogoText").addEventListener("input",e=>{ deck().master.logoText=e.target.value; drawPreview(); });
  shell.querySelector("#pPage").addEventListener("change",e=>{ deck().master.pageNum=e.target.checked; drawPreview(); });
  shell.querySelector("#pptDownload").addEventListener("click",()=>{
    const txt = deck().slides.map((s,i)=>`Slide ${i+1}: ${s.title}\n` + s.bullets.map(b=>"  • "+b.text).join("\n")).join("\n\n");
    downloadBlob(txt, deck().name.replace(/[^a-z0-9]+/gi,"_")+"_outline.txt", "text/plain");
  });

  let presIdx = 0;
  shell.querySelector("#pptPlay").addEventListener("click",()=>{
    presIdx = 0;
    shell.querySelector("#pptPresentArea").style.display = "block";
    renderSlideBox(shell.querySelector("#presBox2"), deck().slides[presIdx], presIdx, deck().slides.length, deck().master);
  });
  shell.querySelector("#pNext").addEventListener("click",()=>{ if(presIdx<deck().slides.length-1){ presIdx++; renderSlideBox(shell.querySelector("#presBox2"), deck().slides[presIdx], presIdx, deck().slides.length, deck().master); } });
  shell.querySelector("#pPrev").addEventListener("click",()=>{ if(presIdx>0){ presIdx--; renderSlideBox(shell.querySelector("#presBox2"), deck().slides[presIdx], presIdx, deck().slides.length, deck().master); } });
  shell.querySelector("#pClose").addEventListener("click",()=>{ shell.querySelector("#pptPresentArea").style.display = "none"; });

  loadDeck();
}

let mailInbox = [
  {id:1, from:"principal@teevessec.edu.ng", subject:"Resumption Date for Next Term", date:"Mon 9:02 AM", read:false,
   body:"Dear Student,\n\nThis is to inform you that the school resumes for the new term on the first Monday of next month. All students are expected to be in full uniform.\n\nRegards,\nThe Principal"},
  {id:2, from:"sportsmaster@teevessec.edu.ng", subject:"Inter-House Sports Practice", date:"Tue 2:15 PM", read:false,
   body:"Hi,\n\nInter-house sports practice begins this Monday after closing hours. Please come along in your house colours.\n\nThank you,\nSports Master"},
  {id:3, from:"librarian@teevessec.edu.ng", subject:"Overdue Library Book Reminder", date:"Wed 11:40 AM", read:true,
   body:"Dear Student,\n\nOur records show you still have a library book that is now overdue. Kindly return it before the end of the week to avoid a fine.\n\nThe Librarian"}
];
let mailSent = [];
let mailFolder = "inbox", mailOpenId = null, mailComposing = false;

function renderOutlookApp(wrap){
  const shell = document.createElement("div");
  shell.className = "office-shell";
  shell.innerHTML = `
    <div class="office-filelist">
      <button class="tbtn" id="mailCompose" style="width:100%;margin-bottom:14px;">✎ Compose</button>
      <div class="office-doc ${mailFolder==='inbox'?'active':''}" data-folder="inbox">📥 Inbox <span style="margin-left:auto;">${mailInbox.filter(m=>!m.read).length||''}</span></div>
      <div class="office-doc ${mailFolder==='sent'?'active':''}" data-folder="sent">📤 Sent</div>
    </div>
    <div class="office-main">
      <div id="mailBody" class="office-body-pad" style="overflow:auto;"></div>
    </div>`;
  wrap.appendChild(shell);

  shell.querySelectorAll("[data-folder]").forEach(f=>f.addEventListener("click",()=>{ mailFolder=f.dataset.folder; mailComposing=false; mailOpenId=null; draw(); }));
  shell.querySelector("#mailCompose").addEventListener("click",()=>{ mailComposing=true; mailOpenId=null; draw(); });

  function listView(){
    const list = mailFolder==="inbox" ? mailInbox : mailSent;
    if(!list.length) return `<div class="hint">No messages here yet.</div>`;
    return list.slice().reverse().map(m=>`
      <div class="office-doc" data-open="${m.id}" style="display:block;margin-bottom:6px;${m.read===false?'font-weight:700;':''}">
        <div style="display:flex;justify-content:space-between;"><span>${mailFolder==='inbox'?m.from:'To: '+m.to}</span><span style="font-size:11px;color:#8a836b;">${m.date}</span></div>
        <div style="font-size:12px;color:#4a4536;">${m.subject}</div>
      </div>`).join("");
  }
  function draw(){
    const body = shell.querySelector("#mailBody");
    drawSidebarBadges();
    if(mailComposing){
      body.innerHTML = `
        <div class="field"><label>To</label><input type="text" id="mTo" placeholder="e.g. principal@teevessec.edu.ng"></div>
        <div class="field"><label>Subject</label><input type="text" id="mSubj"></div>
        <div class="field"><label>Message</label><textarea class="code" id="mBody" style="min-height:180px;color:#1D2029;background:#fff;"></textarea></div>
        <button class="mini-btn" id="mSend">Send</button>`;
      body.querySelector("#mSend").addEventListener("click",()=>{
        const to = body.querySelector("#mTo").value.trim() || "someone@example.com";
        const subj = body.querySelector("#mSubj").value.trim() || "(no subject)";
        const txt = body.querySelector("#mBody").value;
        mailSent.push({id:Date.now(), to, subject:subj, body:txt, date:"Just now"});
        mailComposing = false; mailFolder="sent"; draw();
        setTimeout(()=>{
          mailInbox.push({id:Date.now()+1, from:to, subject:"Re: "+subj, date:"Just now", read:false,
            body:"Thanks for your message — I've received it and will get back to you soon.\n\n(Automated practice reply)"});
          if(mailFolder==="inbox") draw(); else drawSidebarBadges();
        }, 1500);
      });
    } else if(mailOpenId!==null){
      const list = mailFolder==="inbox" ? mailInbox : mailSent;
      const m = list.find(x=>x.id===mailOpenId);
      if(!m){ mailOpenId=null; draw(); return; }
      body.innerHTML = `
        <button class="tbtn" id="mBack" style="margin-bottom:12px;">← Back to ${mailFolder==='inbox'?'Inbox':'Sent'}</button>
        <div style="font-size:16px;font-weight:700;margin-bottom:4px;">${m.subject}</div>
        <div style="font-size:12.5px;color:#8a836b;margin-bottom:14px;">${mailFolder==='inbox'?'From: '+m.from:'To: '+m.to} — ${m.date}</div>
        <div style="white-space:pre-wrap;font-size:13.5px;line-height:1.6;">${m.body}</div>
        ${mailFolder==='inbox' ? '<button class="tbtn" id="mReply" style="margin-top:16px;">↩ Reply</button>' : ''}`;
      body.querySelector("#mBack").addEventListener("click",()=>{ mailOpenId=null; draw(); });
      const replyBtn = body.querySelector("#mReply");
      if(replyBtn) replyBtn.addEventListener("click",()=>{
        mailComposing=true; mailOpenId=null; draw();
        shell.querySelector("#mTo").value = m.from;
        shell.querySelector("#mSubj").value = "Re: "+m.subject;
      });
    } else {
      body.innerHTML = listView();
      body.querySelectorAll("[data-open]").forEach(d=>d.addEventListener("click",()=>{
        mailOpenId = parseInt(d.dataset.open);
        if(mailFolder==="inbox"){ const m=mailInbox.find(x=>x.id===mailOpenId); if(m) m.read=true; }
        draw();
      }));
    }
  }
  function drawSidebarBadges(){
    shell.querySelectorAll("[data-folder]").forEach(f=>f.classList.toggle("active", f.dataset.folder===mailFolder && !mailComposing));
  }
  draw();
}

      <div class="word-canvas"><div class="word-page" id="notePage" contenteditable="true" style="max-width:none;"></div></div>
    </div>`;
  wrap.appendChild(shell);

  function sec(){ return notebook.sections[activeSection]; }
  function drawSecs(){
    shell.querySelector("#secList").innerHTML = notebook.sections.map((s,i)=>`<div class="office-doc ${i===activeSection?'active':''}" data-i="${i}">${s.name}</div>`).join("");
    shell.querySelectorAll("#secList .office-doc").forEach(d=>d.addEventListener("click",()=>{ activeSection=parseInt(d.dataset.i); activePage=0; drawAll(); }));
  }
  function drawPages(){
    shell.querySelector("#pageList").innerHTML = sec().pages.map((p,i)=>`<div class="office-doc ${i===activePage?'active':''}" data-i="${i}">${p.title}</div>`).join("");
    shell.querySelectorAll("#pageList .office-doc").forEach(d=>d.addEventListener("click",()=>{ activePage=parseInt(d.dataset.i); loadPage(); }));
  }
  function loadPage(){ drawPages(); shell.querySelector("#notePage").innerHTML = sec().pages[activePage].html; }
  function drawAll(){ drawSecs(); loadPage(); }
  shell.querySelector("#addSection").addEventListener("click",()=>{
    notebook.sections.push({name:"Section "+(notebook.sections.length+1), pages:[{title:"Untitled Page", html:"<p></p>"}]});
    activeSection = notebook.sections.length-1; activePage=0; drawAll();
  });
  shell.querySelector("#addPage").addEventListener("click",()=>{
    sec().pages.push({title:"Untitled Page "+(sec().pages.length+1), html:"<p></p>"});
    activePage = sec().pages.length-1; loadPage();
  });
  const page = shell.querySelector("#notePage");
  page.addEventListener("input",()=>{ sec().pages[activePage].html = page.innerHTML; });
  function cmd(c,val){ document.execCommand(c,false,val||null); page.focus(); sec().pages[activePage].html = page.innerHTML; }
  shell.querySelector("#nBold").addEventListener("click",()=>cmd("bold"));
  shell.querySelector("#nItalic").addEventListener("click",()=>cmd("italic"));
  shell.querySelector("#nUnderline").addEventListener("click",()=>cmd("underline"));
  shell.querySelector("#nColor").addEventListener("input",e=>cmd("foreColor", e.target.value));
  shell.querySelector("#nUl").addEventListener("click",()=>cmd("insertUnorderedList"));
  shell.querySelector("#nOl").addEventListener("click",()=>cmd("insertOrderedList"));
  drawAll();
}

/* ---------- TYPING TUTOR ---------- */
const typingPassages = [
  "A byte is made up of eight bits, and each bit can only be a zero or a one.",
  "The central processing unit is often called the brain of the computer system.",
  "Random access memory is fast but volatile, while read only memory keeps its data.",
  "Every website you visit is stored on a web server somewhere in the world.",
  "Good spreadsheet formulas always keep assumptions in clearly labelled cells."
];
function renderTypingTutor(wrap){
  const el = labShell(wrap, "TypingTutor.exe", "Practice speed & accuracy — reinforces keyboard skills",
    `<div class="field"><label>Choose a passage</label><select id="tpPick"></select></div>
     <div class="typing-passage" id="tpPassage" style="margin-top:10px;"></div>
     <textarea id="tpInput" rows="3" style="width:100%;margin-top:14px;padding:12px;font-family:'IBM Plex Mono',monospace;font-size:14px;border:1px solid var(--border-light);border-radius:8px;" placeholder="Click here and start typing the passage above..."></textarea>
     <div class="typing-stats">
      <div class="tstat"><b id="tpWpm">0</b><span>WPM</span></div>
      <div class="tstat"><b id="tpAcc">100%</b><span>Accuracy</span></div>
      <div class="tstat"><b id="tpTime">0s</b><span>Time</span></div>
     </div>
     <button class="mini-btn" id="tpRestart">↻ Restart</button>`);
  const pick = el.querySelector("#tpPick");
  pick.innerHTML = typingPassages.map((p,i)=>`<option value="${i}">Passage ${i+1}</option>`).join("");
  let passage = typingPassages[0], startTime=null, timerIv=null;
  function drawPassage(typed){
    const chars = passage.split("").map((c,i)=>{
      let cls = "pending";
      if(i<typed.length) cls = typed[i]===c ? "correct" : "incorrect";
      return `<span class="${cls}">${c===" "?"&nbsp;":c}</span>`;
    }).join("");
    el.querySelector("#tpPassage").innerHTML = chars;
  }
  function updateStats(typed){
    if(!startTime) return;
    const elapsed = (Date.now()-startTime)/1000;
    const words = typed.trim().split(/\s+/).filter(Boolean).length;
    const wpm = elapsed>0 ? Math.round(words/(elapsed/60)) : 0;
    let correct=0; for(let i=0;i<typed.length;i++){ if(typed[i]===passage[i]) correct++; }
    const acc = typed.length ? Math.round(correct/typed.length*100) : 100;
    el.querySelector("#tpWpm").textContent = wpm;
    el.querySelector("#tpAcc").textContent = acc+"%";
    el.querySelector("#tpTime").textContent = Math.round(elapsed)+"s";
  }
  function reset(){
    passage = typingPassages[parseInt(pick.value)];
    startTime = null; if(timerIv) clearInterval(timerIv);
    el.querySelector("#tpInput").value = "";
    el.querySelector("#tpWpm").textContent="0"; el.querySelector("#tpAcc").textContent="100%"; el.querySelector("#tpTime").textContent="0s";
    drawPassage("");
  }
  const input = el.querySelector("#tpInput");
  input.addEventListener("input",()=>{
    if(!startTime){ startTime = Date.now(); timerIv = setInterval(()=>updateStats(input.value), 500); }
    drawPassage(input.value); updateStats(input.value);
    if(input.value.length>=passage.length){ clearInterval(timerIv); }
  });
  pick.addEventListener("change",reset);
  el.querySelector("#tpRestart").addEventListener("click",reset);
  reset();
}

/* ---------- FILE EXPLORER ---------- */
let fsRoot = { name:"This PC", type:"folder", children:[
  {name:"Documents", type:"folder", children:[
    {name:"Assignment1.docx", type:"file"}, {name:"Notes.txt", type:"file"}
  ]},
  {name:"Pictures", type:"folder", children:[
    {name:"logo.png", type:"file"}, {name:"holiday.jpg", type:"file"}
  ]},
  {name:"Downloads", type:"folder", children:[]},
  {name:"School Projects", type:"folder", children:[
    {name:"SS2 Website", type:"folder", children:[{name:"index.html",type:"file"},{name:"style.css",type:"file"}]}
  ]}
]};
let explorerPath = [];

function iconFor(item){
  if(item.type==="folder") return "📁";
  const ext = item.name.split(".").pop().toLowerCase();
  if(["html","css"].includes(ext)) return "🌐";
  if(["png","jpg","jpeg"].includes(ext)) return "🖼️";
  if(["docx","doc"].includes(ext)) return "📄";
  if(["txt"].includes(ext)) return "📝";
  return "📄";
}
function getFolderAt(path){
  let node = fsRoot;
  for(const name of path){ node = node.children.find(c=>c.name===name); if(!node) return fsRoot; }
  return node;
}
function renderFileExplorer(wrap){
  const el = labShell(wrap, "File Explorer", "Navigate folders, create and delete files — real file-management practice",
    `<div class="breadcrumb" id="fxBread"></div>
     <div class="lab-toolbar" style="border-radius:6px;margin-bottom:10px;">
      <button class="tbtn" id="fxNewFolder">+ New Folder</button>
      <button class="tbtn" id="fxNewFile">+ New Text File</button>
      <button class="tbtn" id="fxRename">✎ Rename selected</button>
      <button class="tbtn" id="fxDelete">🗑 Delete selected</button>
     </div>
     <div class="file-grid" id="fxGrid"></div>`);
  let selected = null;
  function draw(){
    const folder = getFolderAt(explorerPath);
    el.querySelector("#fxBread").innerHTML = ["This PC", ...explorerPath].map((p,i)=>`<span data-i="${i}">${p}</span>`).join(" › ");
    el.querySelectorAll("#fxBread span").forEach(s=>s.addEventListener("click",()=>{
      explorerPath = explorerPath.slice(0, parseInt(s.dataset.i)); selected=null; draw();
    }));
    const grid = el.querySelector("#fxGrid");
    if(!folder.children.length){ grid.innerHTML = `<div class="hint">This folder is empty.</div>`; return; }
    grid.innerHTML = folder.children.map((c,i)=>`<div class="file-item ${selected===i?'sel':''}" data-i="${i}"><span class="ico">${iconFor(c)}</span>${c.name}</div>`).join("");
    grid.querySelectorAll(".file-item").forEach(fi=>{
      fi.addEventListener("click",()=>{ selected = parseInt(fi.dataset.i); draw(); });
      fi.addEventListener("dblclick",()=>{
        const item = folder.children[parseInt(fi.dataset.i)];
        if(item.type==="folder"){ explorerPath.push(item.name); selected=null; draw(); }
      });
    });
  }
  el.querySelector("#fxNewFolder").addEventListener("click",()=>{
    const name = prompt("New folder name:","New Folder");
    if(name) getFolderAt(explorerPath).children.push({name, type:"folder", children:[]});
    draw();
  });
  el.querySelector("#fxNewFile").addEventListener("click",()=>{
    const name = prompt("New file name:","New Document.txt");
    if(name) getFolderAt(explorerPath).children.push({name, type:"file"});
    draw();
  });
  el.querySelector("#fxRename").addEventListener("click",()=>{
    if(selected===null){ alert("Select a file or folder first."); return; }
    const folder = getFolderAt(explorerPath);
    const name = prompt("Rename to:", folder.children[selected].name);
    if(name) folder.children[selected].name = name;
    draw();
  });
  el.querySelector("#fxDelete").addEventListener("click",()=>{
    if(selected===null){ alert("Select a file or folder first."); return; }
    getFolderAt(explorerPath).children.splice(selected,1);
    selected = null; draw();
  });
  draw();
}

/* ---------- TASK MANAGER ---------- */
function renderTaskManager(wrap){
  const el = labShell(wrap, "Task Manager", "See how RAM & CPU usage behaves as programs run",
    `<div class="taskmgr-tabs"><button class="tbtn active" id="tmProcTab">Processes</button><button class="tbtn" id="tmPerfTab">Performance</button></div>
     <div id="tmBody"></div>`);
  let procs = [
    {name:"📝 Word — Untitled Document", cpu:4, mem:120},
    {name:"📊 Excel — Book1", cpu:3, mem:95},
    {name:"📽️ PowerPoint — Presentation1", cpu:2, mem:80},
    {name:"🌐 Browser", cpu:12, mem:340},
    {name:"⚙️ System Idle Process", cpu:60, mem:40}
  ];
  let cpuHistory = new Array(30).fill(20);
  let tab = "proc", iv = null;
  function tick(){
    procs.forEach(p=>{ p.cpu = Math.max(1, Math.min(95, p.cpu + (Math.random()*10-5))); p.mem = Math.max(20, p.mem + (Math.random()*20-10)); });
    const total = Math.min(100, Math.round(procs.reduce((s,p)=>s+p.cpu,0)/procs.length + Math.random()*10));
    cpuHistory.push(total); cpuHistory.shift();
    draw();
  }
  function draw(){
    if(!document.body.contains(el)){ clearInterval(iv); return; }
    const body = el.querySelector("#tmBody");
    if(tab==="proc"){
      body.innerHTML = `<div class="proc-row" style="font-weight:700;color:#8a836b;font-size:11px;"><span class="pname">PROCESS</span><span>CPU</span><span style="width:60px;">MEM (MB)</span><span style="width:70px;"></span></div>` +
        procs.map((p,i)=>`
          <div class="proc-row">
            <span class="pname">${p.name}</span>
            <span class="proc-bar-wrap"><div class="proc-bar" style="width:${p.cpu}%;"></div></span>
            <span style="width:60px;">${Math.round(p.mem)}</span>
            <button class="proc-end" data-i="${i}">End Task</button>
          </div>`).join("");
      body.querySelectorAll(".proc-end").forEach(b=>b.addEventListener("click",()=>{ procs.splice(parseInt(b.dataset.i),1); draw(); }));
    } else {
      const w=560,h=140;
      const pts = cpuHistory.map((v,i)=>`${(i/(cpuHistory.length-1))*w},${h-(v/100*h)}`).join(" ");
      body.innerHTML = `<div class="hint" style="margin-bottom:8px;">Overall CPU usage (last 30 samples)</div>
        <svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;background:#fafaf5;border:1px solid var(--border-light);border-radius:8px;">
          <polyline points="${pts}" fill="none" stroke="#FFB627" stroke-width="2"/>
        </svg>
        <div class="hint" style="margin-top:8px;">Current: ${cpuHistory[cpuHistory.length-1]}% CPU</div>`;
    }
  }
  el.querySelector("#tmProcTab").addEventListener("click",(e)=>{ tab="proc"; el.querySelectorAll(".taskmgr-tabs .tbtn").forEach(b=>b.classList.remove("active")); e.target.classList.add("active"); draw(); });
  el.querySelector("#tmPerfTab").addEventListener("click",(e)=>{ tab="perf"; el.querySelectorAll(".taskmgr-tabs .tbtn").forEach(b=>b.classList.remove("active")); e.target.classList.add("active"); draw(); });
  iv = setInterval(tick, 1200);
  draw();
}

/* ---------- PAINT ---------- */
function renderPaintApp(wrap){
  const el = labShell(wrap, "Paint", "Draw freehand and see the RGB behind every colour you pick",
    `<div class="paint-toolbar">
      <label style="font-size:12px;">Colour: <input type="color" id="pkColor" value="#ffb627"></label>
      <span class="hint" id="pkRgb" style="margin:0;"></span>
      <label style="font-size:12px;">Brush: <input type="range" id="pkSize" min="1" max="30" value="5" style="vertical-align:middle;"></label>
      <button class="tbtn" id="pkClear">Clear</button>
      <button class="tbtn" id="pkDownload">⬇ Download PNG</button>
     </div>
     <div class="paint-canvas-wrap"><canvas id="paintCanvas" width="640" height="380"></canvas></div>`);
  const canvas = el.querySelector("#paintCanvas"), ctx = canvas.getContext("2d");
  if(!ctx){ el.querySelector(".paint-canvas-wrap").innerHTML = "<div class='hint'>Canvas drawing isn't supported in this browser.</div>"; return; }
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
  const colorPick = el.querySelector("#pkColor"), sizePick = el.querySelector("#pkSize"), rgbOut = el.querySelector("#pkRgb");
  function updateRgb(){
    const hex = colorPick.value;
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    rgbOut.textContent = `R:${r} G:${g} B:${b}`;
  }
  colorPick.addEventListener("input", updateRgb); updateRgb();
  let drawing = false, last = null;
  function pos(e){ const r = canvas.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return {x:(t.clientX-r.left)*(canvas.width/r.width), y:(t.clientY-r.top)*(canvas.height/r.height)}; }
  function start(e){ drawing=true; last=pos(e); }
  function move(e){
    if(!drawing) return;
    const p = pos(e);
    ctx.strokeStyle = colorPick.value; ctx.lineWidth = +sizePick.value; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last = p; e.preventDefault();
  }
  function end(){ drawing=false; }
  canvas.addEventListener("mousedown",start); canvas.addEventListener("mousemove",move); window.addEventListener("mouseup",end);
  canvas.addEventListener("touchstart",start); canvas.addEventListener("touchmove",move); canvas.addEventListener("touchend",end);
  el.querySelector("#pkClear").addEventListener("click",()=>{ ctx.fillStyle="#fff"; ctx.fillRect(0,0,canvas.width,canvas.height); });
  el.querySelector("#pkDownload").addEventListener("click",()=>{
    const a = document.createElement("a"); a.href = canvas.toDataURL("image/png"); a.download = "my-drawing.png"; a.click();
  });
}

/* ============================================================
   1. FLASHCARDS SYSTEM
   ============================================================ */
let fcCurrentIndex = 0;
let fcFilter = "All";
let fcFlipped = false;

function renderFlashcards(content){
  const wrap = document.createElement("div");
  wrap.className = "fc-wrap";

  const categories = ["All", "Hardware & Data", "Word Processing", "Spreadsheets", "Presentations", "Web Design", "Networking & Web", "Security & Logic"];
  const deck = FLASHCARDS_DATA.filter(c => fcFilter==="All" || c.cat.includes(fcFilter) || (fcFilter==="Web Design" && c.cat.includes("Web")));
  
  if(fcCurrentIndex >= deck.length) fcCurrentIndex = 0;
  const card = deck[fcCurrentIndex] || FLASHCARDS_DATA[0];
  const isMastered = !!state.flashcardMastery[card.id];
  const totalMastered = Object.values(state.flashcardMastery).filter(Boolean).length;
  const pct = Math.round((totalMastered / FLASHCARDS_DATA.length) * 100);

  wrap.innerHTML = `
    <h2 style="margin:0 0 6px;">🗂️ Concept Mastery Flashcards</h2>
    <p class="hint" style="margin-bottom:16px;">Click the card to flip between terms, definitions, and WAEC exam tips.</p>

    <div class="glossary-filter-bar" style="justify-content:center;">
      ${categories.map(cat => `<button class="glossary-chip ${fcFilter===cat?'active':''}" data-cat="${cat}">${cat}</button>`).join("")}
    </div>

    <div class="fc-stat-row">
      <span>Card <strong>${fcCurrentIndex + 1}</strong> of <strong>${deck.length}</strong></span>
      <span>Mastery Progress: <strong>${totalMastered} / ${FLASHCARDS_DATA.length}</strong> (${pct}%)</span>
    </div>

    <div class="fc-card-outer ${fcFlipped ? 'flipped' : ''}" id="fcCard">
      <div class="fc-card-inner">
        <!-- FRONT -->
        <div class="fc-face fc-front">
          <div class="fc-tag">${card.cat}</div>
          <div class="fc-term">${card.term}</div>
          <div class="fc-hint">💡 Hint: ${card.hint}</div>
          <div class="hint" style="margin-top:20px;">(Click card or press Space to flip)</div>
          ${isMastered ? '<div class="badge on" style="margin-top:10px;">✓ Mastered</div>' : ''}
        </div>
        <!-- BACK -->
        <div class="fc-face fc-back">
          <div class="fc-tag">${card.cat} · Definition</div>
          <div class="fc-def">${card.def.replace(/\n/g, '<br>')}</div>
          <div class="fc-exam-tip">🎯 ${card.tip}</div>
        </div>
      </div>
    </div>

    <div class="fc-bar">
      <button class="tbtn" id="fcPrev">← Previous</button>
      <button class="tbtn" id="fcListen" title="Listen to card (Speech)">🔊 Listen</button>
      <button class="mini-btn ${isMastered ? 'ghost' : ''}" id="fcMaster">${isMastered ? '↺ Mark Needs Review' : '✓ Mark Mastered'}</button>
      <button class="tbtn" id="fcNext">Next →</button>
      <button class="tbtn" id="fcShuffle" title="Shuffle deck">🔀 Shuffle</button>
    </div>
  `;
  content.appendChild(wrap);

  wrap.querySelectorAll(".glossary-chip").forEach(btn => {
    btn.addEventListener("click", () => {
      fcFilter = btn.dataset.cat;
      fcCurrentIndex = 0;
      fcFlipped = false;
      render();
    });
  });

  const cardEl = wrap.querySelector("#fcCard");
  cardEl.addEventListener("click", () => {
    fcFlipped = !fcFlipped;
    cardEl.classList.toggle("flipped", fcFlipped);
  });

  wrap.querySelector("#fcPrev").addEventListener("click", () => {
    fcCurrentIndex = (fcCurrentIndex - 1 + deck.length) % deck.length;
    fcFlipped = false;
    render();
  });

  wrap.querySelector("#fcNext").addEventListener("click", () => {
    fcCurrentIndex = (fcCurrentIndex + 1) % deck.length;
    fcFlipped = false;
    render();
  });

  wrap.querySelector("#fcListen").addEventListener("click", (e) => {
    e.stopPropagation();
    const text = `${card.term}. Hint: ${card.hint}. Definition: ${card.def}. Exam tip: ${card.tip}`;
    speakText(text, card.term);
  });

  wrap.querySelector("#fcMaster").addEventListener("click", () => {
    state.flashcardMastery[card.id] = !isMastered;
    saveState();
    render();
  });

  wrap.querySelector("#fcShuffle").addEventListener("click", () => {
    FLASHCARDS_DATA.sort(() => Math.random() - 0.5);
    fcCurrentIndex = 0;
    fcFlipped = false;
    render();
  });
}

/* ============================================================
   3. LOGIC GATES LAB (Area 3 Simulator)
   ============================================================ */
let lgState = { gate:"AND", inA:0, inB:0 };

function calcGate(gate, a, b){
  if(gate==="AND") return (a && b) ? 1 : 0;
  if(gate==="OR") return (a || b) ? 1 : 0;
  if(gate==="NOT") return a ? 0 : 1;
  if(gate==="NAND") return (a && b) ? 0 : 1;
  if(gate==="NOR") return (a || b) ? 0 : 1;
  if(gate==="XOR") return (a !== b) ? 1 : 0;
  return 0;
}

function renderLogicGatesLab(content){
  const wrap = document.createElement("div");
  const isNot = lgState.gate === "NOT";
  const output = calcGate(lgState.gate, lgState.inA, lgState.inB);

  const gates = [
    {id:"AND", name:"AND Gate", formula:"Y = A · B", desc:"Output is 1 ONLY when both inputs A and B are 1."},
    {id:"OR", name:"OR Gate", formula:"Y = A + B", desc:"Output is 1 if AT LEAST ONE input is 1."},
    {id:"NOT", name:"NOT (Inverter)", formula:"Y = ¬A", desc:"Inverts the single input: 0 becomes 1, and 1 becomes 0."},
    {id:"NAND", name:"NAND Gate", formula:"Y = ¬(A · B)", desc:"NOT-AND; output is 0 ONLY when both inputs are 1."},
    {id:"NOR", name:"NOR Gate", formula:"Y = ¬(A + B)", desc:"NOT-OR; output is 1 ONLY when both inputs are 0."},
    {id:"XOR", name:"XOR Gate", formula:"Y = A ⊕ B", desc:"Exclusive OR; output is 1 when inputs are DIFFERENT."}
  ];

  const curr = gates.find(g => g.id === lgState.gate) || gates[0];

  wrap.innerHTML = `
    <h2 style="margin:0 0 4px;">⚡ Logic Gates & Circuit Simulator</h2>
    <p class="lead" style="margin-bottom:18px;">Interact with digital logic hardware, wire connections, and verify truth tables in real time.</p>

    <div class="glossary-filter-bar" style="margin-bottom:18px;">
      ${gates.map(g => `<button class="glossary-chip ${lgState.gate===g.id?'active':''}" data-gate="${g.id}">${g.name}</button>`).join("")}
    </div>

    <div class="gate-board">
      <div class="gate-canvas-box">
        <div style="font-size:16px;font-weight:700;margin-bottom:12px;">${curr.name} (<code style="color:var(--amber);">${curr.formula}</code>)</div>
        <p class="hint" style="margin:0 0 20px;text-align:center;max-width:380px;">${curr.desc}</p>

        <div style="display:flex;align-items:center;gap:30px;justify-content:center;width:100%;">
          <!-- Inputs Column -->

let sqlCurrentQuery = "SELECT name, class_arm, score, grade FROM Students WHERE score >= 75 ORDER BY score DESC;";

function executeSql(rawSql){
  try{
    const sql = rawSql.trim().replace(/;+$/, "");
    if(!sql.toUpperCase().startsWith("SELECT")){
      return { error:"Only SELECT queries are supported in this safe educational sandbox." };
    }

    const fromMatch = sql.match(/FROM\s+([a-zA-Z0-9_]+)/i);
    if(!fromMatch) return { error:"Missing FROM table clause." };
    const tblName = fromMatch[1];
    const matchedKey = Object.keys(SAMPLE_DB).find(k => k.toLowerCase() === tblName.toLowerCase());
    if(!matchedKey) return { error:`Table '${tblName}' not found. Available tables: ${Object.keys(SAMPLE_DB).join(", ")}` };

    let rows = JSON.parse(JSON.stringify(SAMPLE_DB[matchedKey]));

    // WHERE clause
    const whereMatch = sql.match(/WHERE\s+(.*?)(?=\s+ORDER\s+BY|\s+LIMIT|$)/i);
    if(whereMatch){
      const cond = whereMatch[1].trim();
      rows = rows.filter(r => {
        // Evaluate simple comparisons e.g. score >= 75 or category = 'Hardware'
        if(cond.includes(">=")){
          const [f, v] = cond.split(">=").map(s=>s.trim().replace(/['"]/g,""));
          return r[f] !== undefined && Number(r[f]) >= Number(v);
        } else if(cond.includes("<=")){
          const [f, v] = cond.split("<=").map(s=>s.trim().replace(/['"]/g,""));
          return r[f] !== undefined && Number(r[f]) <= Number(v);
        } else if(cond.includes(">")){
          const [f, v] = cond.split(">").map(s=>s.trim().replace(/['"]/g,""));
          return r[f] !== undefined && Number(r[f]) > Number(v);
        } else if(cond.includes("<")){
          const [f, v] = cond.split("<").map(s=>s.trim().replace(/['"]/g,""));
          return r[f] !== undefined && Number(r[f]) < Number(v);
        } else if(cond.includes("=")){
          const [f, v] = cond.split("=").map(s=>s.trim().replace(/['"]/g,""));
          return r[f] !== undefined && String(r[f]).toLowerCase() === String(v).toLowerCase();
        }
        return true;
      });
    }

    // ORDER BY clause
    const orderMatch = sql.match(/ORDER\s+BY\s+([a-zA-Z0-9_]+)(\s+DESC|\s+ASC)?/i);
    if(orderMatch){
      const field = orderMatch[1].trim();
      const isDesc = (orderMatch[2] || "").trim().toUpperCase() === "DESC";
      rows.sort((a,b) => {
        if(a[field] < b[field]) return isDesc ? 1 : -1;
        if(a[field] > b[field]) return isDesc ? -1 : 1;
        return 0;
      });
    }

    // LIMIT clause
    const limitMatch = sql.match(/LIMIT\s+(\d+)/i);
    if(limitMatch){
      const lim = parseInt(limitMatch[1]);
      rows = rows.slice(0, lim);
    }

    // Column projection (SELECT ...)
    const selectMatch = sql.match(/SELECT\s+(.*?)\s+FROM/i);
    const colStr = selectMatch ? selectMatch[1].trim() : "*";
    let finalRows = rows;
    if(colStr !== "*"){
      const cols = colStr.split(",").map(c => c.trim());
      finalRows = rows.map(r => {
        const obj = {};
        cols.forEach(c => { if(r[c]!==undefined) obj[c] = r[c]; });
        return obj;
      });
    }

    return { data: finalRows, count: finalRows.length, timeMs: (Math.random()*2 + 0.8).toFixed(2) };
  }catch(e){
    return { error: "SQL Syntax Error: " + e.message };
  }
}

function calcEntropy(pw){
  let pool = 0;
  if(/[a-z]/.test(pw)) pool += 26;
  if(/[A-Z]/.test(pw)) pool += 26;
  if(/[0-9]/.test(pw)) pool += 10;
  if(/[^a-zA-Z0-9]/.test(pw)) pool += 33;
  if(pool === 0 || pw.length === 0) return { bits:0, pool:0, time:"Instant" };
  const bits = Math.round(pw.length * Math.log2(pool));
  
  let time = "Instant";
  if(bits < 28) time = "Under a second";
  else if(bits < 40) time = "Several minutes";
  else if(bits < 55) time = "A few weeks";
  else if(bits < 70) time = "Thousands of years";
  else time = "Millions of centuries";
  return { bits, pool, time };
}

const CBT_CONFIG = {
  numQuestions: 20,
  durationMinutes: 15,
  passMark: 50,
  topicFilter: "all"
};

let cbtSession = null;
let cbtTimerInterval = null;

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function buildCbtBank(){
  let bank = [];
  // 1. Practice questions from TOPICS
  TOPICS.forEach(t=>{
    if(CBT_CONFIG.topicFilter === "all" || CBT_CONFIG.topicFilter == t.num){
      t.practice.forEach(q=>{
        bank.push({ topicTitle:t.title, topicNum:t.num, q:q.q, opts:q.opts.slice(), correct:q.correct, exp:q.exp });
      });
    }
  });
  // 2. Questions from Expanded CBT_QUESTION_BANK
  CBT_QUESTION_BANK.forEach(q => {
    if(CBT_CONFIG.topicFilter === "all" || CBT_CONFIG.topicFilter == q.topicNum){
      bank.push({ topicTitle:q.topicTitle, topicNum:q.topicNum, q:q.q, opts:q.opts.slice(), correct:q.correct, exp:q.exp });
    }
  });
  return bank;
}

function shuffleQuestionOptions(q){
  const order = shuffleArr(q.opts.map((_,i)=>i));
  return { ...q, opts: order.map(i=>q.opts[i]), correct: order.indexOf(q.correct) };
}

function formatTime(s){
  s = Math.max(0,s);
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}

function startCbt(){
  const bank = buildCbtBank();
  const count = Math.min(CBT_CONFIG.numQuestions, bank.length);
  const picked = shuffleArr(bank).slice(0, count).map(shuffleQuestionOptions);
  
  cbtSession = {
    questions: picked,
    answers: {},
    flagged: new Set(),
    currentIdx: 0,
    secondsLeft: CBT_CONFIG.durationMinutes * 60,
    submitted: false,
    autoSubmitted: false
  };
  render();
  startCbtTimer();
}

function startCbtTimer(){
  if(cbtTimerInterval) clearInterval(cbtTimerInterval);
  cbtTimerInterval = setInterval(()=>{
    if(!cbtSession || cbtSession.submitted){ clearInterval(cbtTimerInterval); cbtTimerInterval=null; return; }
    cbtSession.secondsLeft--;
    const timerEl = document.getElementById("cbtTimer");
    if(!timerEl || !document.body.contains(timerEl)){ clearInterval(cbtTimerInterval); cbtTimerInterval=null; return; }
    timerEl.textContent = formatTime(cbtSession.secondsLeft);
    if(cbtSession.secondsLeft<=60) timerEl.style.color = "#ff6b6b";
    if(cbtSession.secondsLeft<=0) submitCbt(true);
  },1000);
}

function submitCbt(auto){
  if(!cbtSession || cbtSession.submitted) return;
  cbtSession.submitted = true;
  cbtSession.autoSubmitted = auto;
  if(cbtTimerInterval){ clearInterval(cbtTimerInterval); cbtTimerInterval=null; }
  
  let score = 0;
  const breakdown = {};
  cbtSession.questions.forEach((q,i)=>{
    const ans = cbtSession.answers[i];
    const correct = ans === q.correct;
    if(correct) score++;
    breakdown[q.topicTitle] = breakdown[q.topicTitle] || {correct:0,total:0};
    breakdown[q.topicTitle].total++;
    if(correct) breakdown[q.topicTitle].correct++;
  });
  
  cbtSession.score = score;
  cbtSession.breakdown = breakdown;
  state.cbtHistory.push({
    date: new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}),
    score,
    total: cbtSession.questions.length,
    pct: Math.round((score / cbtSession.questions.length) * 100)
  });
  saveState();
  render();
}

function renderCbtExam(content){
  const wrap = document.createElement("div");
  wrap.innerHTML = `
