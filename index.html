<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Technologies Workbench — SS2 First Term</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14171F; --panel:#1B2130; --panel2:#232A3C; --paper:#F3F0E6; --paper-dim:#E9E5D6;
  --amber:#FFB627; --amber-dim:#8a6a1f; --green:#3DDC97; --red:#FF6B6B;
  --text-dark:#E7E3D4; --text-ink:#1D2029; --text-mute:#8B93A7;
  --border-dark:#2E3549; --border-light:#D8D3BF;
  font-family:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--ink);color:var(--text-dark);}
body{display:flex;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
h1,h2,h3,h4,.brand,.tab,.week-num{font-family:'Space Grotesk',sans-serif;}
code,.mono,textarea.code,.code-out,.formula-bar,.cell input{font-family:'IBM Plex Mono',monospace;}
button{font-family:'IBM Plex Sans',sans-serif;}

/* ===== Sidebar ===== */
.sidebar{width:250px;min-width:250px;background:var(--panel);border-right:1px solid var(--border-dark);height:100vh;position:sticky;top:0;overflow-y:auto;display:flex;flex-direction:column;}
.brand{padding:22px 20px 16px;font-size:18px;font-weight:700;color:var(--amber);border-bottom:1px solid var(--border-dark);line-height:1.3;}
.brand span{display:block;font-size:11px;color:var(--text-mute);font-family:'IBM Plex Sans',sans-serif;font-weight:400;margin-top:4px;}
.week-list{list-style:none;margin:0;padding:10px;flex:1;}
.week-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;transition:background .15s ease;}
.week-item:hover{background:var(--panel2);}
.week-item.active{background:var(--panel2);box-shadow:inset 3px 0 0 var(--amber);}
.week-num{width:26px;height:26px;min-width:26px;border-radius:6px;background:var(--ink);color:var(--text-mute);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;border:1px solid var(--border-dark);}
.week-item.active .week-num{background:var(--amber);color:var(--ink);border-color:var(--amber);}
.week-title{font-size:13.5px;line-height:1.3;}
.week-title small{display:block;color:var(--text-mute);font-size:11px;margin-top:2px;font-family:'IBM Plex Sans',sans-serif;}
.progress-foot{padding:16px 20px;border-top:1px solid var(--border-dark);font-size:11.5px;color:var(--text-mute);}
.progress-bar{height:5px;background:var(--ink);border-radius:3px;overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;background:var(--green);width:0%;transition:width .3s ease;}

/* ===== Home / landing page ===== */
.home-wrap{padding:40px 48px 80px;max-width:1020px;}
.hero{background:linear-gradient(135deg,var(--ink) 0%,#232a3c 100%);color:#fff;border-radius:16px;padding:30px 34px;margin-bottom:24px;}
.hero .clockrow{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;}
.hero .greet{font-size:23px;font-weight:700;font-family:'Space Grotesk',sans-serif;margin:0 0 6px;}
.hero .sub{color:#b9c0d4;font-size:13px;}
.hero .clockbox{text-align:right;}
.hero .time{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:600;color:var(--amber);letter-spacing:.02em;}
.hero .date{font-size:11.5px;color:#b9c0d4;margin-top:2px;}
.setup-card{background:#fff;border:1px solid var(--border-light);border-radius:14px;padding:28px 30px;max-width:480px;}
.setup-card h2{margin:0 0 6px;font-size:19px;color:var(--text-ink);}
.setup-card p.lead{color:#6b6553;font-size:13.5px;margin:0 0 18px;}
.profile-card{background:#fff;border:1px solid var(--border-light);border-radius:14px;padding:22px 24px;margin-bottom:22px;display:flex;gap:20px;flex-wrap:wrap;align-items:center;}
.avatar-circle{width:60px;height:60px;border-radius:50%;background:var(--amber);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;font-family:'Space Grotesk',sans-serif;flex:none;}
.profile-info{flex:1;min-width:220px;}
.profile-info .pname{font-size:18px;font-weight:700;color:var(--text-ink);}
.profile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px;}
.profile-grid .pi b{display:block;color:#8a836b;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;}
.profile-grid .pi span{font-size:13.5px;color:var(--text-ink);}
.edit-profile-btn{background:transparent;border:1px solid var(--border-light);color:#6b6553;padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;flex:none;}
.edit-profile-btn:hover{border-color:var(--amber-dim);}
.stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:24px;}
.stat-card{flex:1;min-width:140px;background:#fff;border:1px solid var(--border-light);border-radius:12px;padding:16px 18px;}
.stat-card .num{font-family:'Space Grotesk',sans-serif;font-size:25px;font-weight:700;color:var(--ink);}
.stat-card .lbl{font-size:11.5px;color:#8a836b;margin-top:2px;}
.section-lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#8a836b;margin:0 0 12px;}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:10px;}
.topic-card{background:#fff;border:1px solid var(--border-light);border-radius:12px;padding:16px 18px;cursor:pointer;transition:transform .15s,border-color .15s;}
.topic-card:hover{transform:translateY(-2px);border-color:var(--amber-dim);}
.topic-card .tnum{width:26px;height:26px;border-radius:6px;background:var(--paper-dim);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#6b6553;margin-bottom:8px;}
.topic-card.done .tnum{background:var(--green);color:#fff;}
.topic-card h4{margin:0 0 4px;font-size:13.5px;color:var(--text-ink);}
.topic-card p{margin:0;font-size:11.5px;color:#8a836b;}
.topic-card .score-tag{display:inline-block;margin-top:8px;font-size:10.5px;font-weight:700;background:var(--paper-dim);padding:2px 8px;border-radius:10px;color:#6b6553;}

.side-section-lbl{padding:16px 12px 6px;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#5b6178;font-weight:700;}

/* ===== Office Suite ===== */
.office-shell{display:flex;gap:0;border:1px solid var(--border-light);border-radius:12px;overflow:hidden;background:#fff;min-height:560px;}
.office-filelist{width:190px;min-width:190px;background:var(--paper-dim);border-right:1px solid var(--border-light);padding:12px;}
.office-filelist .ofl-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#8a836b;margin-bottom:10px;}
.office-doc{padding:9px 10px;border-radius:7px;font-size:12.5px;cursor:pointer;margin-bottom:4px;background:#fff;border:1px solid transparent;display:flex;justify-content:space-between;align-items:center;gap:6px;}
.office-doc.active{border-color:var(--amber);background:#fff7e0;font-weight:600;}
.office-doc .del{color:#c98;font-size:12px;cursor:pointer;flex:none;}
.office-doc .del:hover{color:var(--red);}
.office-main{flex:1;min-width:0;display:flex;flex-direction:column;}
.office-toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 14px;background:var(--paper-dim);border-bottom:1px solid var(--border-light);}
.office-toolbar select{padding:5px 6px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;}
.otbtn{background:#fff;border:1px solid var(--border-light);border-radius:5px;width:28px;height:28px;font-size:13px;cursor:pointer;font-weight:700;color:#4a4536;}
.otbtn:hover{border-color:var(--amber-dim);}
.otbtn.wide{width:auto;padding:0 10px;}
.office-toolbar input[type=color]{width:30px;height:28px;border:1px solid var(--border-light);border-radius:5px;padding:2px;cursor:pointer;background:#fff;}
.word-canvas{flex:1;padding:28px 40px;overflow:auto;background:#fbfaf6;}
.word-page{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);border:1px solid var(--border-light);max-width:680px;min-height:500px;margin:0 auto;padding:50px 56px;font-size:14.5px;line-height:1.7;outline:none;}
.sheet-tabs{display:flex;gap:2px;padding:6px 10px;background:var(--paper-dim);border-top:1px solid var(--border-light);}
.sheet-tab{padding:6px 12px;font-size:11.5px;font-weight:600;background:#fff;border:1px solid var(--border-light);border-radius:5px 5px 0 0;cursor:pointer;color:#6b6553;}
.sheet-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.office-body-pad{padding:18px;flex:1;overflow:auto;}
.ppt-canvas{display:flex;gap:16px;padding:18px;flex:1;}
.ppt-canvas .slide-list{flex:0 0 150px;}

/* ===== Main ===== */
.main{flex:1;min-width:0;background:var(--paper);color:var(--text-ink);}
.topbar{background:var(--paper);border-bottom:1px solid var(--border-light);padding:26px 40px 0;position:sticky;top:0;z-index:5;}
.topic-heading{font-size:26px;font-weight:700;margin:0 0 4px;color:var(--text-ink);}
.topic-sub{color:#6b6553;font-size:14px;margin-bottom:18px;}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border-light);flex-wrap:wrap;}
.tab{padding:10px 16px;font-size:13.5px;font-weight:600;color:#6b6553;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .15s ease;white-space:nowrap;}
.tab:hover{color:var(--text-ink);}
.tab.active{color:var(--text-ink);border-bottom-color:var(--amber);}
.content{padding:32px 40px 80px;max-width:960px;}

/* ===== Learn ===== */
.lesson-block{margin-bottom:32px;}
.lesson-block h3{font-size:18px;margin:0 0 12px;color:var(--text-ink);border-left:4px solid var(--amber);padding-left:12px;font-family:'Space Grotesk',sans-serif;}
.lesson-block h4{font-size:15px;margin:18px 0 8px;color:var(--text-ink);font-weight:700;}
.lesson-block p{margin:0 0 12px;line-height:1.7;font-size:14.5px;color:#333026;}
.lesson-block ul,.lesson-block ol{margin:0 0 14px;padding-left:22px;}
.lesson-block li{margin-bottom:8px;line-height:1.65;font-size:14.5px;}
.lesson-block li strong{color:var(--text-ink);}
.note-box{background:#fff;border:1px solid var(--border-light);border-radius:12px;padding:22px 24px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.note-callout{background:#fffdf0;border-left:4px solid var(--amber);padding:14px 18px;border-radius:0 8px 8px 0;margin:16px 0;font-size:13.5px;line-height:1.6;}
.note-table{width:100%;border-collapse:collapse;margin:14px 0 18px;font-size:13.5px;}
.note-table th{background:var(--paper-dim);border:1px solid var(--border-light);padding:9px 12px;text-align:left;font-weight:700;}
.note-table td{border:1px solid var(--border-light);padding:8px 12px;}
.note-action-bar{display:flex;gap:10px;justify-content:space-between;align-items:center;background:var(--paper-dim);border:1px solid var(--border-light);border-radius:10px;padding:12px 18px;margin-bottom:24px;flex-wrap:wrap;}
body.dark .note-box{background:#1e2230;border-color:#2b3244;color:#cfd3e0;}
body.dark .note-callout{background:#26241a;border-left-color:var(--amber);color:#ffe082;}
body.dark .note-table th{background:#262c3d;border-color:#2b3244;color:#e7e3d4;}
body.dark .note-table td{border-color:#2b3244;color:#cfd3e0;}
body.dark .note-action-bar{background:#1e2230;border-color:#2b3244;}
body.dark .lesson-block p{color:#cfd3e0;}
body.dark .lesson-block h4{color:#EDEBDF;}

/* ===== Real life ===== */
.reallife-card{background:#fff;border:1px solid var(--border-light);border-radius:10px;padding:20px 22px;margin-bottom:16px;}
.reallife-card h4{margin:0 0 8px;font-size:15px;color:var(--text-ink);display:flex;align-items:center;gap:8px;}
.reallife-card h4::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;}
.reallife-card p{margin:0;font-size:14px;line-height:1.6;color:#4a4536;}

/* ===== Practice / quiz ===== */
.quiz-q{background:#fff;border:1px solid var(--border-light);border-radius:10px;padding:18px 20px;margin-bottom:14px;}
.quiz-q p.prompt{font-weight:600;margin:0 0 12px;font-size:14.5px;color:var(--text-ink);}
.quiz-opt{display:block;padding:9px 12px;border:1px solid var(--border-light);border-radius:7px;margin-bottom:8px;cursor:pointer;font-size:13.5px;transition:border-color .15s;}
.quiz-opt:hover{border-color:var(--amber-dim);}
.quiz-opt input{margin-right:9px;}
.quiz-opt.correct{border-color:var(--green);background:#effbf4;}
.quiz-opt.incorrect{border-color:var(--red);background:#fff0f0;}
.quiz-feedback{font-size:13px;margin-top:10px;padding:10px 12px;border-radius:6px;display:none;line-height:1.5;}
.quiz-feedback.show{display:block;}
.quiz-feedback.ok{background:#effbf4;color:#1c6b45;}
.quiz-feedback.bad{background:#fff0f0;color:#a33;}
.quiz-score{background:var(--ink);color:var(--paper);padding:16px 20px;border-radius:10px;font-size:14px;margin-top:6px;display:flex;justify-content:space-between;align-items:center;}
.quiz-score .num{font-family:'Space Grotesk',sans-serif;font-size:22px;color:var(--amber);font-weight:700;}
.btn-check{background:var(--ink);color:var(--paper);border:none;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;}
.btn-check:hover{background:#000;}
.btn-check:disabled{opacity:.4;cursor:default;}

/* ===== Lab / app window chrome ===== */
.lab{background:#fff;border:1px solid var(--border-light);border-radius:12px;overflow:hidden;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.lab-bar{background:var(--ink);color:#cfcabb;padding:10px 16px;display:flex;align-items:center;gap:8px;font-size:12.5px;}
.lab-bar .dots{display:flex;gap:5px;margin-right:8px;}
.lab-bar .dot{width:9px;height:9px;border-radius:50%;}
.lab-bar .dot.r{background:#ff6159;} .lab-bar .dot.y{background:#ffbd2e;} .lab-bar .dot.g{background:#28c840;}
.lab-bar .name{font-weight:600;color:#fff;}
.lab-bar .desc{color:#9aa1b5;margin-left:auto;font-size:11.5px;text-align:right;}
.lab-body{padding:20px 22px;}
.lab-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--paper-dim);border-bottom:1px solid var(--border-light);padding:8px 14px;}
.lab-toolbar select, .lab-toolbar input[type=text]{padding:5px 8px;border:1px solid var(--border-light);border-radius:5px;font-size:12.5px;}
.tbtn{background:#fff;border:1px solid var(--border-light);border-radius:5px;padding:6px 10px;font-size:12px;cursor:pointer;font-weight:600;color:#4a4536;}
.tbtn:hover{border-color:var(--amber-dim);}
.tbtn.active{background:var(--ink);color:#fff;border-color:var(--ink);}

/* generic form bits */
.field-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
.field{flex:1;min-width:160px;}
.field label{display:block;font-size:12px;font-weight:600;color:#6b6553;margin-bottom:5px;}
.field input[type=text],.field input[type=number],.field select{width:100%;padding:8px 10px;border:1px solid var(--border-light);border-radius:6px;font-size:13.5px;background:var(--paper-dim);}
.field input[type=range]{width:100%;}
textarea.code{width:100%;min-height:150px;padding:12px;border:1px solid var(--border-light);border-radius:8px;font-size:12.5px;background:#1e2230;color:#e7e3d4;resize:vertical;line-height:1.5;}
.out-box{background:var(--ink);color:var(--paper);border-radius:8px;padding:14px 16px;font-size:13px;margin-top:12px;white-space:pre-wrap;line-height:1.6;}
.out-box .k{color:var(--amber);}
.split{display:flex;gap:18px;flex-wrap:wrap;}
.split>div{flex:1;min-width:260px;}
iframe.preview{width:100%;height:260px;border:1px solid var(--border-light);border-radius:8px;background:#fff;}
.mini-btn{background:var(--amber);color:var(--ink);border:none;padding:9px 16px;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer;}
.mini-btn:hover{filter:brightness(1.08);}
.mini-btn:disabled{opacity:.4;cursor:default;}
.mini-btn.ghost{background:transparent;border:1px solid var(--ink);color:var(--ink);}
.hint{font-size:12px;color:#8a836b;margin-top:6px;}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--paper-dim);color:#6b6553;}
.badge.on{background:var(--green);color:#fff;}
.badge.warn{background:var(--red);color:#fff;}

/* Stepper (mail merge wizard, ftp steps) */
.stepper-nav{display:flex;gap:0;margin-bottom:18px;flex-wrap:wrap;}
.stepper-nav .sp{flex:1;min-width:90px;text-align:center;font-size:11px;font-weight:600;color:#a39b7f;padding:8px 4px;border-bottom:3px solid var(--border-light);}
.stepper-nav .sp.active{color:var(--ink);border-bottom-color:var(--amber);}
.stepper-nav .sp.done{color:var(--green);}
.step-track{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px;border:1px solid var(--border-light);border-radius:8px;opacity:.45;transition:opacity .25s,border-color .25s;}
.step.active{opacity:1;border-color:var(--amber);}
.step.done{opacity:1;border-color:var(--green);}
.step .dot2{width:22px;height:22px;border-radius:50%;background:var(--paper-dim);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;}
.step.active .dot2{background:var(--amber);}
.step.done .dot2{background:var(--green);color:#fff;}

/* Spreadsheet grid */
.sheet-wrap{overflow-x:auto;border:1px solid var(--border-light);border-radius:8px;}
table.sheet{border-collapse:collapse;font-size:12px;min-width:100%;}
table.sheet th{background:var(--ink);color:#cfcabb;padding:5px 4px;font-weight:600;text-align:center;position:sticky;top:0;min-width:78px;}
table.sheet th.rownum{min-width:26px;background:#0d0f15;}
table.sheet td.rownum{background:var(--paper-dim);text-align:center;font-weight:600;color:#8a836b;}
table.sheet td{border:1px solid var(--border-light);padding:0;min-width:78px;}
table.sheet td input{width:100%;border:none;padding:5px 6px;font-size:12px;background:transparent;font-family:'IBM Plex Mono',monospace;text-align:left;}
table.sheet td input:focus{background:#fff7e0;outline:2px solid var(--amber);outline-offset:-2px;}
table.sheet td.sel{background:#fff7e0;}
.formula-bar{display:flex;align-items:center;gap:8px;background:var(--paper-dim);border:1px solid var(--border-light);border-radius:6px;padding:6px 10px;margin-bottom:8px;font-size:12.5px;}
.formula-bar .name-box{background:var(--ink);color:var(--amber);padding:3px 9px;border-radius:4px;font-weight:700;min-width:34px;text-align:center;}
.formula-bar input{flex:1;border:none;background:transparent;font-size:12.5px;}
.formula-bar input:focus{outline:none;}

/* Drag drop pivot / ftp */
.dnd-row{display:flex;gap:14px;flex-wrap:wrap;}
.field-pool{display:flex;flex-direction:column;gap:6px;min-width:140px;}
.drag-pill{background:var(--paper-dim);border:1px solid var(--border-light);border-radius:6px;padding:8px 10px;font-size:12.5px;font-weight:600;cursor:grab;user-select:none;}
.drag-pill:active{cursor:grabbing;}
.dropzone{flex:1;min-width:150px;min-height:80px;border:2px dashed var(--border-light);border-radius:8px;padding:8px;background:#fafaf5;}
.dropzone .dz-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#a39b7f;font-weight:700;margin-bottom:6px;}
.dropzone.over{border-color:var(--amber);background:#fff7e0;}
.dropped-pill{background:var(--ink);color:#fff;border-radius:6px;padding:6px 9px;font-size:12px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.dropped-pill span.x{cursor:pointer;color:var(--red);font-weight:700;}

.ftp-panes{display:flex;gap:14px;flex-wrap:wrap;}
.ftp-pane{flex:1;min-width:220px;background:#fafaf5;border:1px solid var(--border-light);border-radius:8px;padding:12px;min-height:220px;}
.ftp-pane-title{font-size:12px;font-weight:700;color:#4a4536;margin-bottom:10px;display:flex;justify-content:space-between;}
.ftp-file{background:#fff;border:1px solid var(--border-light);border-radius:6px;padding:8px 10px;margin-bottom:7px;font-size:12.5px;display:flex;align-items:center;justify-content:space-between;cursor:grab;}
.ftp-file:active{cursor:grabbing;}
.ftp-file .up{background:var(--amber);border:none;border-radius:4px;padding:3px 7px;font-size:11px;cursor:pointer;font-weight:700;}
.ftp-pane.over{border-color:var(--amber);background:#fff7e0;}
.browser-frame{border:1px solid var(--border-light);border-radius:8px;overflow:hidden;margin-top:14px;}
.browser-bar{background:#e9e5d6;padding:8px 12px;font-size:12px;color:#4a4536;display:flex;align-items:center;gap:8px;}
.browser-bar .url{background:#fff;border-radius:14px;padding:4px 12px;flex:1;font-family:'IBM Plex Mono',monospace;font-size:11.5px;}

/* file tabs (html/css lab) */
.file-tabs{display:flex;gap:2px;background:var(--paper-dim);padding:6px 6px 0;border-radius:8px 8px 0 0;border:1px solid var(--border-light);border-bottom:none;}
.file-tab{padding:7px 14px;font-size:12px;font-weight:600;border-radius:6px 6px 0 0;cursor:pointer;color:#8a836b;background:transparent;}
.file-tab.active{background:#1e2230;color:#e7e3d4;}

/* slides */
.slide-list{display:flex;flex-direction:column;gap:8px;min-width:150px;}
.slide-thumb{border:2px solid var(--border-light);border-radius:6px;padding:8px;font-size:11px;cursor:pointer;background:#fff;position:relative;}
.slide-thumb.active{border-color:var(--amber);}
.slide-thumb .num{position:absolute;top:-8px;left:-8px;background:var(--ink);color:#fff;width:18px;height:18px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;}
.slide-preview-box{border:2px solid #ccc;border-radius:8px;padding:26px;min-height:180px;background:#fff;position:relative;}
.slide-preview-box .pagenum{position:absolute;bottom:8px;right:12px;font-size:10px;color:#999;}
.slide-preview-box .logo{position:absolute;top:8px;right:12px;font-size:10px;font-weight:700;color:var(--amber-dim);}
.bullet-row{display:flex;align-items:center;gap:8px;background:var(--paper-dim);border-radius:6px;padding:6px 8px;margin-bottom:6px;font-size:12.5px;}
.bullet-row input[type=text]{flex:1;border:1px solid var(--border-light);border-radius:4px;padding:4px 6px;font-size:12.5px;}
.bullet-row .mv{cursor:pointer;font-size:12px;background:#fff;border:1px solid var(--border-light);border-radius:4px;padding:2px 6px;}

/* network lab */
.device-card{background:#fff;border:1px solid var(--border-light);border-radius:8px;padding:10px 12px;font-size:12.5px;min-width:130px;text-align:center;}
.device-card .ip{font-family:'IBM Plex Mono',monospace;color:var(--amber-dim);font-weight:700;margin-top:4px;}
.device-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}

@media(max-width:820px){
  body{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;min-width:0;}
  .content{padding:24px 18px 60px;}
  .topbar{padding:20px 18px 0;}
  .split>div{min-width:0;}
}

/* ===== Skills practice tools ===== */
.explorer-shell{display:flex;border:1px solid var(--border-light);border-radius:12px;overflow:hidden;background:#fff;min-height:460px;}
.explorer-tree{width:200px;min-width:200px;background:var(--paper-dim);border-right:1px solid var(--border-light);padding:12px;font-size:12.5px;}
.tree-node{padding:6px 8px;border-radius:6px;cursor:pointer;margin-bottom:2px;}
.tree-node:hover{background:#fff;}
.tree-node.active{background:var(--ink);color:#fff;}
.explorer-pane{flex:1;padding:16px 20px;}
.breadcrumb{font-size:12px;color:#8a836b;margin-bottom:14px;}
.breadcrumb span{cursor:pointer;color:var(--amber-dim);}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;}
.file-item{text-align:center;padding:12px 6px;border-radius:8px;cursor:pointer;font-size:11.5px;border:1px solid transparent;word-break:break-word;}
.file-item:hover{background:var(--paper-dim);}
.file-item.sel{border-color:var(--amber);background:#fff7e0;}
.file-item .ico{font-size:30px;display:block;margin-bottom:6px;}

.taskmgr-tabs{display:flex;gap:2px;margin-bottom:12px;}
.proc-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border-light);font-size:12.5px;}
.proc-row .pname{flex:1;}
.proc-bar-wrap{width:90px;height:8px;background:var(--paper-dim);border-radius:4px;overflow:hidden;}
.proc-bar{height:100%;background:var(--amber);}
.proc-end{background:transparent;border:1px solid var(--border-light);border-radius:5px;padding:3px 8px;font-size:11px;cursor:pointer;}

.typing-passage{font-family:'IBM Plex Mono',monospace;font-size:16px;line-height:1.9;background:#fff;border:1px solid var(--border-light);border-radius:10px;padding:20px 22px;letter-spacing:.2px;}
.typing-passage span.correct{color:var(--green);}
.typing-passage span.incorrect{color:#fff;background:var(--red);border-radius:2px;}
.typing-passage span.pending{color:#b8b2a0;}
.typing-stats{display:flex;gap:16px;margin:14px 0;}
.typing-stats .tstat{background:#fff;border:1px solid var(--border-light);border-radius:8px;padding:10px 16px;text-align:center;}
.typing-stats .tstat b{display:block;font-family:'Space Grotesk',sans-serif;font-size:22px;color:var(--ink);}
.typing-stats .tstat span{font-size:10.5px;color:#8a836b;text-transform:uppercase;letter-spacing:.04em;}

.paint-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--paper-dim);border-bottom:1px solid var(--border-light);}
.paint-canvas-wrap{background:#e9e5d6;padding:16px;display:flex;justify-content:center;}
#paintCanvas{background:#fff;border:1px solid var(--border-light);border-radius:4px;cursor:crosshair;touch-action:none;}

.certificate-box{border:10px double var(--amber-dim);border-radius:14px;padding:46px 40px;text-align:center;background:#fffdf6;max-width:680px;margin:0 auto;}
.certificate-box .cert-brand{font-family:'Space Grotesk',sans-serif;font-size:13px;letter-spacing:.15em;color:#8a836b;text-transform:uppercase;}
.certificate-box h2{font-family:'Space Grotesk',sans-serif;font-size:28px;margin:14px 0 4px;color:var(--ink);}
.certificate-box .cert-name{font-size:26px;font-weight:700;color:var(--amber-dim);margin:18px 0 6px;font-family:'Space Grotesk',sans-serif;}
.certificate-box .cert-line{font-size:13.5px;color:#4a4536;margin:4px 0;}
.certificate-box .cert-stats{display:flex;justify-content:center;gap:30px;margin:22px 0;}
.certificate-box .cert-stats div{font-size:12px;color:#6b6553;}
.certificate-box .cert-stats b{display:block;font-size:20px;color:var(--ink);font-family:'Space Grotesk',sans-serif;}
.report-box{max-width:680px;margin:0 auto;background:#fff;border:1px solid var(--border-light);border-radius:12px;padding:30px 34px;}
.report-box table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px;}
.report-box th,.report-box td{border:1px solid var(--border-light);padding:8px 10px;text-align:left;}

/* ===== CBT (Computer-Based Test) ===== */
.cbt-start-card{background:#fff;border:1px solid var(--border-light);border-radius:14px;padding:30px 34px;max-width:620px;margin:0 auto;}
.cbt-start-card h2{margin:0 0 6px;font-size:20px;color:var(--text-ink);}
.cbt-meta-row{display:flex;gap:14px;margin:18px 0;flex-wrap:wrap;}
.cbt-meta-row .m{flex:1;min-width:120px;background:var(--paper-dim);border-radius:10px;padding:12px 14px;text-align:center;}
.cbt-meta-row .m b{display:block;font-family:'Space Grotesk',sans-serif;font-size:20px;color:var(--ink);}
.cbt-meta-row .m span{font-size:11px;color:#8a836b;text-transform:uppercase;letter-spacing:.04em;}
.cbt-rules{font-size:13.5px;line-height:1.7;color:#4a4536;padding-left:20px;margin:14px 0 22px;}
.cbt-topbar{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;padding:14px 22px;border-radius:12px 12px 0 0;}
.cbt-timer{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;color:var(--amber);background:#0d0f15;padding:6px 14px;border-radius:8px;}
.cbt-shell{border:1px solid var(--border-light);border-radius:12px;overflow:hidden;}
.cbt-body{display:flex;gap:0;background:#fff;min-height:420px;}
.cbt-question-panel{flex:1;padding:26px 30px;min-width:0;}
.cbt-nav-panel{width:240px;min-width:240px;background:var(--paper-dim);border-left:1px solid var(--border-light);padding:18px 16px;}
.cbt-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.cbt-nav-btn{aspect-ratio:1;border-radius:6px;border:1px solid var(--border-light);background:#fff;font-size:11.5px;font-weight:700;cursor:pointer;color:#6b6553;}
.cbt-nav-btn.answered{background:var(--green);color:#fff;border-color:var(--green);}
.cbt-nav-btn.flagged{background:var(--amber);color:var(--ink);border-color:var(--amber-dim);}
.cbt-nav-btn.current{outline:2px solid var(--ink);outline-offset:1px;}
.cbt-legend{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:11px;color:#6b6553;}
.cbt-legend .dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:middle;}
.cbt-legend .dot.answered{background:var(--green);}
.cbt-legend .dot.flagged{background:var(--amber);}
.cbt-legend .dot.current{background:#fff;border:2px solid var(--ink);}
.cbt-option{display:block;padding:11px 14px;border:1px solid var(--border-light);border-radius:8px;margin-bottom:9px;cursor:pointer;font-size:13.5px;}
.cbt-option:hover{border-color:var(--amber-dim);}
.cbt-option.picked{border-color:var(--ink);background:#f3f0e6;font-weight:600;}
.cbt-result-q{background:#fff;border:1px solid var(--border-light);border-radius:10px;padding:16px 18px;margin-bottom:12px;}
.cbt-result-q .ropt{padding:7px 10px;border-radius:6px;font-size:12.5px;margin-bottom:5px;border:1px solid var(--border-light);}
.cbt-result-q .ropt.correct{border-color:var(--green);background:#effbf4;}
.cbt-result-q .ropt.wrong{border-color:var(--red);background:#fff0f0;}
body.dark .cbt-start-card,body.dark .cbt-nav-panel,body.dark .cbt-body,body.dark .cbt-option,body.dark .cbt-nav-btn,body.dark .cbt-result-q{background:#1e2230;border-color:#2b3244;color:#cfd3e0;}
body.dark .cbt-meta-row .m{background:#262c3d;}
body.dark .cbt-option.picked{background:#2b3244;}
.report-box th{background:var(--paper-dim);}

/* ===== Revision Tools: Flashcards & Glossary ===== */
.fc-wrap{max-width:680px;margin:0 auto;text-align:center;}
.fc-card-outer{perspective:1000px;margin:24px auto;width:100%;max-width:540px;height:300px;cursor:pointer;}
.fc-card-inner{position:relative;width:100%;height:100%;text-align:center;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.08);}
.fc-card-outer.flipped .fc-card-inner{transform:rotateY(180deg);}
.fc-face{position:absolute;width:100%;height:100%;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:16px;padding:30px 34px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#fff;border:2px solid var(--border-light);}
.fc-back{transform:rotateY(180deg);background:#fffdf6;border-color:var(--amber-dim);}
.fc-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#8a836b;margin-bottom:12px;background:var(--paper-dim);padding:3px 10px;border-radius:12px;}
.fc-term{font-size:24px;font-weight:700;color:var(--ink);font-family:'Space Grotesk',sans-serif;margin-bottom:10px;}
.fc-hint{font-size:12px;color:#8a836b;}
.fc-def{font-size:15px;line-height:1.6;color:var(--text-ink);margin-bottom:12px;}
.fc-exam-tip{font-size:12px;color:#8a6a1f;background:#fff7e0;padding:6px 12px;border-radius:6px;border-left:3px solid var(--amber);}
.fc-bar{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
.fc-stat-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:13px;color:#6b6553;}

.glossary-wrap{max-width:880px;margin:0 auto;}
.glossary-search{width:100%;padding:12px 16px;font-size:15px;border:1px solid var(--border-light);border-radius:10px;background:#fff;margin-bottom:14px;}
.glossary-filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.glossary-chip{padding:6px 14px;border-radius:20px;border:1px solid var(--border-light);background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:#6b6553;}
.glossary-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.glossary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.glossary-card{background:#fff;border:1px solid var(--border-light);border-radius:12px;padding:18px 20px;}
.glossary-card h4{margin:0 0 6px;font-size:16px;color:var(--text-ink);display:flex;align-items:center;justify-content:space-between;}
.glossary-cat-badge{font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:10px;background:var(--paper-dim);color:#6b6553;}
.glossary-card p{margin:0 0 8px;font-size:13px;line-height:1.55;color:#4a4536;}
.glossary-card .tip{font-size:11.5px;color:#8a6a1f;background:#fff7e0;padding:4px 8px;border-radius:4px;}

/* ===== Interactive Practical Simulators ===== */
/* 1. Logic Gates Lab */
.gate-board{display:flex;gap:20px;flex-wrap:wrap;align-items:stretch;}
.gate-canvas-box{flex:1;min-width:320px;background:#fff;border:1px solid var(--border-light);border-radius:12px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.gate-truth-box{width:280px;min-width:280px;background:#fff;border:1px solid var(--border-light);border-radius:12px;padding:20px;}
.sw-btn{background:#e9e5d6;border:2px solid #b8b2a0;border-radius:8px;padding:8px 14px;font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;cursor:pointer;transition:all .15s;}
.sw-btn.on{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 0 10px rgba(61,220,151,.5);}
.led-box{display:flex;flex-direction:column;align-items:center;gap:6px;}
.led-circle{width:46px;height:46px;border-radius:50%;background:#3a3f50;border:3px solid #5a6178;transition:all .2s;}
.led-circle.on{background:#ffb627;border-color:#ffe082;box-shadow:0 0 24px #ffb627,0 0 8px #fff;}
.truth-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px;}
.truth-tbl th,.truth-tbl td{border:1px solid var(--border-light);padding:7px 8px;text-align:center;}
.truth-tbl tr.active-row{background:#fff7e0;font-weight:700;border:2px solid var(--amber);}

/* 2. SQL Lab */
.sql-shell{display:flex;gap:18px;flex-wrap:wrap;}
.sql-sidebar{width:220px;min-width:220px;background:#fff;border:1px solid var(--border-light);border-radius:12px;padding:16px;}
.sql-main{flex:1;min-width:320px;display:flex;flex-direction:column;gap:14px;}
.sql-editor-box{background:#1e2230;border-radius:10px;padding:14px;border:1px solid var(--border-dark);}
.sql-editor-box textarea{width:100%;min-height:90px;background:transparent;color:#3ddc97;border:none;font-family:'IBM Plex Mono',monospace;font-size:14px;resize:vertical;outline:none;}
.sql-res-wrap{background:#fff;border:1px solid var(--border-light);border-radius:10px;overflow-x:auto;padding:14px;}
.sql-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.sql-table th{background:var(--paper-dim);padding:8px 10px;border:1px solid var(--border-light);text-align:left;font-weight:600;}
.sql-table td{padding:7px 10px;border:1px solid var(--border-light);}
.sql-pill{background:var(--paper-dim);border:1px solid var(--border-light);border-radius:6px;padding:4px 9px;font-size:11.5px;font-family:'IBM Plex Mono',monospace;cursor:pointer;margin-bottom:4px;display:inline-block;}
.sql-pill:hover{border-color:var(--amber-dim);background:#fff7e0;}

/* 3. Network Topology Lab */
.net-stage-box{background:#fff;border:1px solid var(--border-light);border-radius:12px;padding:20px;min-height:360px;position:relative;display:flex;align-items:center;justify-content:center;}
.net-log-box{background:var(--ink);color:#e7e3d4;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:12px 16px;border-radius:8px;max-height:140px;overflow-y:auto;margin-top:14px;}

/* 4. Cybersecurity Lab */
.entropy-meter{height:10px;background:#e9e5d6;border-radius:5px;overflow:hidden;margin:10px 0;}
.entropy-fill{height:100%;width:0%;transition:width .3s,background-color .3s;}
.crack-row{display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--border-light);font-size:12.5px;}
.crack-row b{font-family:'IBM Plex Mono',monospace;}
.phish-box{background:#fff;border:1px solid var(--border-light);border-radius:12px;padding:22px;margin-bottom:16px;}
.phish-header-row{background:var(--paper-dim);padding:10px 14px;border-radius:8px;font-size:12.5px;margin-bottom:14px;line-height:1.6;}
.phish-header-row .flag-tag{color:var(--red);font-weight:700;}

/* CBT Config Additions */
.cbt-config-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:18px 0;}
.cbt-config-field label{display:block;font-size:11.5px;font-weight:700;color:#6b6553;text-transform:uppercase;margin-bottom:5px;}
.cbt-config-field select{width:100%;padding:8px 10px;border:1px solid var(--border-light);border-radius:6px;font-size:13px;background:var(--paper-dim);}

/* Dark Mode Extensions */
body.dark .fc-face,body.dark .glossary-card,body.dark .glossary-chip,body.dark .glossary-search,
body.dark .gate-canvas-box,body.dark .gate-truth-box,body.dark .sql-sidebar,body.dark .sql-res-wrap,
body.dark .net-stage-box,body.dark .phish-box{
  background:#1e2230;border-color:#2b3244;color:#cfd3e0;
}
body.dark .fc-term,body.dark .glossary-card h4{color:#EDEBDF;}
body.dark .fc-def,body.dark .glossary-card p{color:#cfd3e0;}
body.dark .fc-tag,body.dark .glossary-cat-badge,body.dark .sql-pill,body.dark .sql-table th{
  background:#262c3d;color:#a0a8c0;border-color:#333b52;

#voiceHud{
  position:fixed;

@keyframes slideUp{
  from{transform:translate(-50%,20px);opacity:0;}

}
.voice-wave{

  0%,100%{transform:scaleY(0.3);}
  50%{transform:scaleY(1);}
}

{
  id:"spreadsheets2", num:4, title:"Advanced Spreadsheet Analysis II", sub:"Financial models, Scenario Manager & Goal Seek",
  learn:[
    {
      h:"1. Principles of Financial & Business Modelling",
      items:[
        "<strong>Definition of a Financial Model:</strong> A mathematical representation of a real-world business, project, or financial situation built in a spreadsheet to forecast future performance, assess investment feasibility, and guide decision-making.",
        "<strong>Three-Part Model Structure:</strong>",
        "1. <strong>Inputs / Assumptions:</strong> All variable baseline figures (e.g. Unit Price, Cost per Unit, Rent, Inflation Rate, Tax Rate).",
        "2. <strong>Calculations Engine:</strong> Dynamic formulas linking assumptions to financial operations.",
        "3. <strong>Outputs / Forecasts:</strong> Key performance indicators (Total Revenue, Gross Profit, Net Profit, Break-even Point).",
        "<strong>The Golden Rule of Financial Modelling:</strong>",
        "• <em>NEVER hard-code numbers inside formulas</em> (e.g. write <code>=B2*B$1</code> instead of <code>=B2*3500</code>).",
        "• All assumptions belong in their own dedicated, clearly labeled cells so that altering a single assumption updates the entire model automatically.",
        "<strong>Fundamental Financial Formulas:</strong>",
        "• <code>Total Revenue = Unit Selling Price &times; Units Sold</code>",
        "• <code>Gross Profit = Total Revenue &minus; Cost of Goods Sold (COGS)</code>",
        "• <code>Net Profit = Gross Profit &minus; Operating Expenses (Rent + Salaries + Utilities)</code>"
      ]
    },
    {
      h:"2. What-If Analysis Tools Overview",
      items:[
        "<strong>What-If Analysis:</strong> The process of changing the values in cells to see how those changes will affect the outcome of formulas on the worksheet.",
        "Excel provides three primary What-If Analysis tools found under <strong>Data &rarr; What-If Analysis</strong>: (1) Scenario Manager, (2) Goal Seek, and (3) Data Tables."
      ]
    },
    {
      h:"3. Scenario Manager (Multi-Variable Forecasting)",
      items:[
        "<strong>Definition:</strong> An Excel analysis tool that allows you to store, manage, and switch between different named sets of input assumptions on the same worksheet.",
        "<strong>Common Business Scenarios:</strong>",
        "• <strong>Base Case (Most Likely):</strong> Normal expected prices, sales volume, and operating costs.",
        "• <strong>Best Case (Optimistic):</strong> High sales volume, premium pricing, lower material costs.",
        "• <strong>Worst Case (Pessimistic):</strong> Economic downturn, low sales volume, elevated inflation and energy costs.",
        "<strong>How Scenario Manager Works:</strong>",
        "• You designate <strong>Changing Cells</strong> (the cells holding your assumptions).",
        "• You define values for each scenario.",
        "• You can generate a comprehensive <strong>Scenario Summary Report</strong> on a new worksheet comparing all cases side-by-side."
      ]
    },
    {
      h:"4. Goal Seek (Reverse Single-Variable Calculation)",
      items:[
        "<strong>Definition:</strong> A What-If Analysis tool that works backwards from a desired outcome (target value) to determine the exact single input variable needed to achieve that target.",
        "<strong>The Three Required Parameters in Goal Seek:</strong>",
        "1. <strong>Set cell:</strong> The reference of the cell containing the formula whose result you want to set (e.g. <code>B10</code> holding Net Profit).",
        "2. <strong>To value:</strong> The specific numerical target you wish to achieve (e.g. <code>1000000</code>).",
        "3. <strong>By changing cell:</strong> The single assumption cell that Excel is permitted to iteratively adjust until the formula hits the target (e.g. <code>B2</code> holding Selling Price).",
        "<strong>Practical Applications:</strong> Finding the exact price to charge to break even, calculating the required sales units to make &#8358;500,000 profit, or calculating the maximum loan interest rate you can afford."
      ]
    },
    {
      h:"5. Data Validation & Formula Auditing",
      items:[
        "<strong>Data Validation:</strong> Restricts the type of data or the values that users can enter into a cell (found under <strong>Data &rarr; Data Validation</strong>).",
        "• Prevents human input errors by enforcing rules (e.g. score must be a whole number between 0 and 100).",
        "• Generates interactive <strong>Dropdown Lists</strong> (e.g. selecting class arm: 'SS2 Gold', 'SS2 Silver').",
        "• Displays custom <em>Input Messages</em> and <em>Error Alerts</em>.",
        "<strong>Formula Auditing Tools:</strong>",
        "• <strong>Trace Precedents:</strong> Draws blue arrows pointing to the cells that provide data directly to the active formula.",
        "• <strong>Trace Dependents:</strong> Draws blue arrows showing which other formulas depend on the active cell."
      ]
    }
  ],
  realLife:[
    {t:"Bakery Startup Feasibility Study", d:"An entrepreneur models flour price, oven electricity, rent, and loaf selling price to determine how many loaves must be baked and sold each month to break even and generate profit."},
    {t:"School Event Budgeting with Scenario Manager", d:"Organizers create a Worst Case (200 attendees, low sponsorship) vs Best Case (800 attendees, high sponsorship) to decide ticket pricing before printing flyers."},
    {t:"Loan Repayment Planning with Goal Seek", d:"A business owner uses Goal Seek to discover: 'If my monthly income only allows &#8358;50,000 loan repayment, what is the maximum principal loan amount I can borrow at 12% interest?'"}
  ],
  practice:[
    {q:"What is the most important rule of good financial modelling?",opts:["Use as many colours as possible","Never hard-code numbers inside formulas — keep assumptions in labelled cells","Always use VLOOKUP","Keep the model on one line"],correct:1,exp:"Assumptions belong in their own clearly labelled cells so the whole model updates when they change."},
    {q:"Which tool works backwards from a target result to find the required input?",opts:["Scenario Manager","Pivot Table","Goal Seek","SUMIF"],correct:2,exp:"Goal Seek takes your desired outcome and calculates the input needed to achieve it."},
    {q:"In Goal Seek, what does 'By changing cell' refer to?",opts:["The formula cell showing the result","The one assumption cell Excel is allowed to adjust","The chart title","The print area"],correct:1,exp:"'By changing cell' is the single input cell Excel iterates on to hit your target."}
  ]

{
  id:"presentations", num:5, title:"Advanced Presentation Design", sub:"C.R.A.P. principles, Slide Master & multimedia",
  learn:[
    {
      h:"1. Principles of Effective Visual Presentation",
      items:[
        "<strong>Presentation Software:</strong> Specialized tools (Microsoft PowerPoint, Google Slides, Keynote) designed to support spoken communication through structured visual aids.",
        "<strong>The Core Objective of Slides:</strong> Slides are visual accompaniments to emphasize key ideas, not teleprompters filled with walls of text for the speaker to read verbatim.",
        "<strong>The 6&times;6 Rule:</strong> A best-practice guideline recommending a maximum of 6 bullet points per slide, with no more than 6 words per bullet point."
      ]
    },
    {
      h:"2. The C.R.A.P. Design Framework in Depth",
      items:[
        "Robin Williams' universal design framework consisting of four core pillars:",
        "1. <strong>Contrast:</strong>",
        "• Make elements that are different <em>really different</em> so the viewer's eye immediately grasps the visual hierarchy.",
        "• Use high-contrast color pairings (dark text on white/cream background, or white text on deep navy background). Avoid low-contrast traps like yellow text on white.",
        "• Use contrasting font sizes (large bold headlines vs smaller body text).",
        "2. <strong>Repetition:</strong>",
        "• Repeat consistent visual elements throughout the entire presentation (identical corporate brand colors, typography pairings, bullet styles, icon aesthetics).",
        "• Repetition creates visual unity, consistency, and professional brand identity.",
        "3. <strong>Alignment:</strong>",
        "• Every single element on a slide must have a deliberate visual connection with something else on the page.",
        "• Align text boxes, images, and headers along clear invisible grid lines (Left-aligned text is significantly easier to read than Centered body text). Avoid floating elements.",
        "4. <strong>Proximity:</strong>",
        "• Group related items physically close together so they are perceived as a cohesive visual unit.",
        "• Leave intentional whitespace (negative space) between distinct sections so the audience does not feel overwhelmed."
      ]
    },
    {
      h:"3. The Slide Master Architecture",
      items:[
        "<strong>Definition of the Slide Master:</strong> The top-level master slide in the presentation hierarchy that stores the global theme information, typography, background formatting, color schemes, and universal placeholder layouts.",
        "<strong>Slide Master Hierarchy:</strong>",
        "• <strong>Parent Slide Master:</strong> Changes made here (e.g. inserting the school crest in the top-right corner) apply universally to every single slide in the deck.",
        "• <strong>Layout Masters:</strong> Specific child layouts (Title Slide layout, Title & Content layout, Two-Column comparison layout) inheriting from the parent.",
        "<strong>Practical Applications:</strong>",
        "• Inserting company logos, confidentiality notices, and automatic slide numbering once on the Slide Master rather than manually copying and pasting onto 60 individual slides.",
        "• Ensuring consistent branding across large organizations."
      ]
    },
    {
      h:"4. Multimedia Integration & Motion Graphics",
      items:[
        "<strong>Embedded Media vs. Linked Media:</strong>",
        "• <strong>Embedded Media:</strong> Video and audio files are stored directly inside the presentation file. Highly recommended because the presentation remains fully portable when moved via USB or email.",
        "• <strong>Linked Media:</strong> The presentation only stores a pointer path to an external media file on your hard drive. If the media file is moved or deleted, the link breaks during playback.",
        "<strong>Transitions vs. Animations:</strong>",
        "• <strong>Slide Transitions:</strong> The visual and sound effects that occur when moving from one entire slide to the next (e.g. Fade, Push, Wipe).",
        "• <strong>Object Animations:</strong> Effects applied to individual elements (text lines, pictures, shapes) on a single slide.",
        "• <strong>Four Animation Categories:</strong> (1) <em>Entrance</em> (how items appear), (2) <em>Emphasis</em> (drawing attention), (3) <em>Exit</em> (how items leave), and (4) <em>Motion Paths</em>.",
        "• <em>Golden Rule of Motion:</em> Use subtle, purposeful animations (e.g. Fade, Appear) to reveal bullet points progressively as you speak. Avoid excessive, distracting animations."
      ]
    },
    {
      h:"5. Interactive Presentations & Action Navigation",
      items:[
        "<strong>Action Buttons & Hyperlinks:</strong> Interactive vector buttons inserted on slides that allow non-linear navigation (e.g. jumping to a specific case study, opening a spreadsheet, or returning to a Main Menu slide).",
        "<strong>Self-Running Kiosk Presentations:</strong> Presentations configured under <em>Slide Show &rarr; Set Up Slide Show</em> to loop continuously without a human presenter (used at trade fairs and school reception displays)."
      ]
    }
  ],
  realLife:[
    {t:"Pitching a Business Idea to Investors", d:"A startup founder applies C.R.A.P. principles to design a high-contrast, perfectly aligned pitch deck that communicates the value proposition in 10 concise slides."},
    {t:"Standardizing School Assembly Presentations", d:"Using the Slide Master to embed the school motto, emblem, and slide numbers ensures all teachers' presentations maintain pristine corporate standards."},
    {t:"Creating an Interactive Digital Quiz", d:"Using Action Buttons and Hyperlinked slides to create an interactive branching multiple-choice quiz game for students in the computer lab."}
  ],
  practice:[
    {q:"Which C.R.A.P. principle is about grouping related items together?",opts:["Contrast","Repetition","Alignment","Proximity"],correct:3,exp:"Proximity groups related items close together, creating clear, readable sections."},
    {q:"What is the Slide Master used for?",opts:["Recording narration","Controlling elements that repeat across every slide","Compressing video files","Creating charts"],correct:1,exp:"The Slide Master is the master template — anything added there (logo, page number) appears on every slide."},
    {q:"What's the key difference between an animation and a transition?",opts:["They are the same thing","Animations affect individual objects; transitions affect the whole slide","Transitions only work with audio","Animations only work in Google Slides"],correct:1,exp:"Transitions govern how a whole slide enters/exits; animations govern individual objects on a slide."}
  ]
},
{
  id:"htmlcss", num:6, title:"Web Design I — HTML & CSS", sub:"Structure with HTML, style with CSS",
  learn:[
    {
      h:"1. The World Wide Web & Client-Server Architecture",
      items:[
        "<strong>The Web Ecosystem:</strong> The Web operates on a <strong>Client-Server Model</strong>.",
        "• <strong>Web Client (Browser):</strong> Software (Google Chrome, Mozilla Firefox, Safari, Microsoft Edge) running on user devices that requests web pages, parses HTML/CSS/JS, and renders visual graphics.",
        "• <strong>Web Server:</strong> Powerful computers (running Apache, Nginx, or IIS) hosting website files that listen for requests and transmit web assets back to the browser.",
        "• <strong>HTTP / HTTPS (Hypertext Transfer Protocol Secure):</strong> The standardized protocol governing encrypted communications between clients and web servers over ports 80 (HTTP) and 443 (HTTPS)."
      ]
    },
    {
      h:"2. HTML (HyperText Markup Language) Fundamentals",
      items:[
        "<strong>Definition:</strong> The universal standard markup language used to structure web pages and define their semantic content.",
        "<strong>HTML is NOT a Programming Language:</strong> It possesses no logic, variables, or computational loops; it uses <strong>tags</strong> enclosed in angle brackets (<code>&lt;tag&gt;Content&lt;/tag&gt;</code>) to describe content.",
        "<strong>The Essential HTML Document Boilerplate:</strong>",
        "• <code>&lt;!DOCTYPE html&gt;</code>: Informs the browser that the document is modern HTML5.",
        "• <code>&lt;html lang=\"en\"&gt;</code>: The root container element for the entire page.",
        "• <code>&lt;head&gt;</code>: Contains machine-readable metadata, title, character encoding, and external resource links (not displayed directly on the webpage).",
        "• <code>&lt;meta charset=\"UTF-8\"&gt;</code>: Specifies UTF-8 character encoding.",
        "• <code>&lt;title&gt;</code>: Defines the page title shown on the browser tab.",
        "• <code>&lt;body&gt;</code>: Contains all visible elements (headings, paragraphs, images, tables, buttons)."
      ]
    },
    {
      h:"3. Core Semantic Content Tags",
      items:[
        "<strong>Headings:</strong> <code>&lt;h1&gt;</code> (Main title, only one per page recommended) through <code>&lt;h6&gt;</code> (Lowest sub-heading).",
        "<strong>Text Paragraphs & Formatting:</strong>",
        "• <code>&lt;p&gt;</code>: Defines a paragraph of text.",
        "• <code>&lt;strong&gt;</code>: Indicates strong importance (rendered bold).",
        "• <code>&lt;em&gt;</code>: Indicates emphasis (rendered italic).",
        "• <code>&lt;br&gt;</code>: Empty/self-closing tag inserting a single line break.",
        "• <code>&lt;hr&gt;</code>: Empty tag rendering a thematic horizontal rule divider.",
        "<strong>Lists:</strong>",
        "• <code>&lt;ul&gt;</code>: Unordered (bulleted) list.",
        "• <code>&lt;ol&gt;</code>: Ordered (numbered) list.",
        "• <code>&lt;li&gt;</code>: List item (used inside <code>&lt;ul&gt;</code> and <code>&lt;ol&gt;</code>).",
        "<strong>Hyperlinks & Media:</strong>",
        "• <code>&lt;a href=\"URL\" target=\"_blank\"&gt;Anchor Text&lt;/a&gt;</code>: Creates a clickable hyperlink.",
        "• <code>&lt;img src=\"image.jpg\" alt=\"Description\" width=\"300\"&gt;</code>: Embeds an image. The <code>alt</code> attribute is essential for accessibility screen readers and displays fallback text if images fail to load."
      ]
    },
    {
      h:"4. Introduction to CSS (Cascading Style Sheets)",
      items:[
        "<strong>Definition of CSS:</strong> A style sheet language used to describe the presentation, layout, colors, typography, and visual aesthetics of an HTML document.",
        "<strong>Separation of Concerns:</strong> HTML handles structure; CSS handles presentation; JavaScript handles interactive behavior.",
        "<strong>CSS Rule Syntax:</strong>",
        "<code>selector { property: value; }</code>",
        "• <em>Selector:</em> Points to the HTML element to style (e.g. <code>p</code>, <code>h1</code>).",
        "• <em>Property:</em> The style attribute being modified (e.g. <code>color</code>, <code>font-size</code>).",
        "• <em>Value:</em> The setting assigned to the property (e.g. <code>#FFB627</code>, <code>16px</code>).",
        "<strong>Three Ways to Insert CSS into HTML:</strong>",
        "1. <strong>External Stylesheet (Best Practice):</strong> CSS rules are stored in a separate <code>style.css</code> file and linked inside the <code>&lt;head&gt;</code> via <code>&lt;link rel=\"stylesheet\" href=\"style.css\"&gt;</code>. Allows styling an entire multi-page website from one file.",
        "2. <strong>Internal Stylesheet:</strong> CSS written inside a <code>&lt;style&gt;</code> element inside the <code>&lt;head&gt;</code>. Suitable only for single-page documents.",
        "3. <strong>Inline Styles (Worst Practice):</strong> CSS written directly inside an HTML tag using the <code>style=\"...\"</code> attribute. Makes maintenance difficult and violates separation of concerns."
      ]
    },
    {
      h:"5. Essential CSS Properties",
      items:[
        "• <code>color</code>: Sets foreground text color (named, hex e.g. <code>#1B2130</code>, or RGB).",
        "• <code>background-color</code>: Sets the element's background color.",
        "• <code>font-family</code>: Sets font typeface with fallback choices (e.g. <code>'Space Grotesk', sans-serif</code>).",
        "• <code>font-size</code>: Specifies text size (e.g. <code>16px</code>, <code>1.2rem</code>).",
        "• <code>text-align</code>: Aligns text (<code>left</code>, <code>center</code>, <code>right</code>, <code>justify</code>).",
        "• <code>line-height</code>: Controls vertical line spacing for readability."
      ]
    }
  ],
  realLife:[
    {t:"Building a Personal Portfolio Website", d:"Every website on the internet, from student portfolios to news portals, is constructed using this fundamental HTML5 semantic structure styled with external CSS sheets."},
    {t:"Fixing Broken Images Online", d:"Understanding the alt attribute explains why screen readers can speak image contents to visually impaired users and why descriptive text shows when networks fail."},
    {t:"Corporate Brand Consistency via CSS", d:"A multinational firm changes its primary brand color across 500 web pages instantly simply by editing one line in its external style.css file."}
  ],
  practice:[
    {q:"Why is HTML called a markup language rather than a programming language?",opts:["It cannot be edited","It has no logic — it only structures content with tags","It only runs on Windows","It requires a compiler"],correct:1,exp:"HTML has no logic or calculations — it simply marks up content using tags."},
    {q:"Which method of adding CSS is considered best practice?",opts:["Inline (style attribute)","Internal (&lt;style&gt; tag)","External (.css file linked in the head)","Typing CSS into the URL bar"],correct:2,exp:"An external stylesheet keeps content and style separate, which is easier to maintain across many pages."},
    {q:"What does the alt attribute of an &lt;img&gt; tag do?",opts:["Sets the image's width","Provides alternate text for accessibility or if the image fails to load","Changes the image's colour","Links to another page"],correct:1,exp:"alt text is read by screen readers and shown if the image itself doesn't load — critical for accessibility."}
  ]
},
{
  id:"boxmodel", num:7, title:"Web Design II — Box Model & Multi-page Sites", sub:"Padding, border, margin, id/class & navigation",
  learn:[
    {
      h:"1. The CSS Box Model Masterclass",
      items:[
        "<strong>Universal Principle:</strong> In CSS, browser rendering engines treat every single HTML element as a rectangular box.",
        "<strong>The Four Concentric Layers (From Inside to Outside):</strong>",
        "1. <strong>Content:</strong> The central area where text, images, or media reside.",
        "2. <strong>Padding:</strong> Transparent inner clearance area between the content and the inner border. Expands the element's interior background.",
        "3. <strong>Border:</strong> The frame line wrapping around the padding and content (e.g. <code>border: 2px solid #FFB627;</code>).",
        "4. <strong>Margin:</strong> Transparent outer clearance area outside the border that pushes neighboring HTML elements away.",
        "<strong>Box Dimensions Calculation Formula:</strong>",
        "• <code>Total Rendered Width = width + left/right padding + left/right border + left/right margin</code>",
        "• <code>box-sizing: border-box</code>: Modern CSS standard where specified width includes content, padding, and border, preventing layout breakage."
      ]
    },
    {
      h:"2. CSS Selectors: Tag, Class, and ID",
      items:[
        "<strong>1. Element (Tag) Selector:</strong> Targets every occurrence of an HTML tag.",
        "• Example: <code>p { line-height: 1.6; }</code> (styles all paragraphs).",
        "<strong>2. Class Selector (Prefixed with a Dot <code>.</code>):</strong>",
        "• Applied in HTML via <code>class=\"card\"</code>; targeted in CSS via <code>.card { ... }</code>.",
        "• <strong>Reusable:</strong> The same class can be assigned to dozens of different elements across the page.",
        "<strong>3. ID Selector (Prefixed with a Hash <code>#</code>):</strong>",
        "• Applied in HTML via <code>id=\"site-header\"</code>; targeted in CSS via <code>#site-header { ... }</code>.",
        "• <strong>Unique:</strong> An ID must be unique to exactly ONE single element per web page (used for major layout anchors or JavaScript hooks).",
        "<strong>Common Pseudo-Classes:</strong>",
        "• <code>:hover</code>: Styles an element when the user's mouse hovers over it (e.g. <code>button:hover { background: #FFB627; }</code>).",
        "• <code>:active</code>: Styles an element while it is actively being clicked."
      ]
    },
    {
      h:"3. Block-Level vs. Inline Elements",
      items:[
        "<strong>Block-Level Elements:</strong>",
        "• Always begin on a new line and automatically stretch to occupy the full 100% width of their parent container.",
        "• Respect top and bottom margins and padding.",
        "• Examples: <code>&lt;div&gt;</code>, <code>&lt;p&gt;</code>, <code>&lt;h1&gt;</code>–<code>&lt;h6&gt;</code>, <code>&lt;ul&gt;</code>, <code>&lt;header&gt;</code>, <code>&lt;section&gt;</code>.",
        "<strong>Inline Elements:</strong>",
        "• Do NOT start on a new line; they sit smoothly inside the flow of text, occupying only the exact width of their content.",
        "• Do not respect vertical margin/height properties.",
        "• Examples: <code>&lt;span&gt;</code>, <code>&lt;a&gt;</code>, <code>&lt;strong&gt;</code>, <code>&lt;em&gt;</code>.",
        "<strong>The Generic Containers:</strong> <code>&lt;div&gt;</code> is the generic block container used for section grouping; <code>&lt;span&gt;</code> is the generic inline container used to style words within a sentence."
      ]
    },
    {
      h:"4. Architecting Multi-Page Websites & Navigation",
      items:[
        "<strong>Project Folder Structure:</strong> A real-world website is a directory containing linked files:",
        "• <code>index.html</code> (The homepage / default landing file)",
        "• <code>about.html</code>, <code>services.html</code>, <code>contact.html</code>",
        "• <code>css/style.css</code> (Central stylesheet)",
        "• <code>images/logo.png</code> (Graphics directory)",
        "<strong>Relative File Path Linking:</strong>",
        "• Linking to another page in the same folder: <code>&lt;a href=\"about.html\"&gt;About Us&lt;/a&gt;</code>",
        "• Linking to an image inside a subfolder: <code>&lt;img src=\"images/logo.png\"&gt;</code>",
        "<strong>Site-Wide Navigation Menu:</strong> An identical <code>&lt;nav&gt;</code> menu must be copied into the header of every page on the site, with relative links pointing to all other pages to guarantee smooth, continuous site navigation."
      ]
    }
  ],
  realLife:[
    {t:"Spacing Elements on Web Pages", d:"Every margin gap between sections and every padding cushion inside a button is controlled by the CSS Box Model."},
    {t:"Designing an E-Commerce Product Card", d:"Developers create a reusable .product-card class in CSS and apply it across 200 items in an online store so they all display matching borders, shadows, and margins."},
    {t:"Building a 4-Page School Website", d:"Students link index.html, academics.html, admissions.html, and contact.html through a shared navigation bar styled with a single external stylesheet."}
  ],
  practice:[
    {q:"Listed from the content outward, what is the correct Box Model order?",opts:["Content → Margin → Border → Padding","Content → Padding → Border → Margin","Border → Content → Padding → Margin","Margin → Padding → Content → Border"],correct:1,exp:"From inside out: Content, then Padding, then Border, then Margin."},
    {q:"Which selector must be unique on a page?",opts:["class","id","div","span"],correct:1,exp:"An id identifies one single unique element; a class can be reused many times."},
    {q:"Why must the same &lt;nav&gt; block be copied onto every page of a site?",opts:["Because HTML requires it by law","To keep navigation identical and consistent across the whole site","Because CSS cannot style repeated menus","It's not necessary at all"],correct:1,exp:"Copying the identical nav block onto every page keeps the navigation consistent site-wide."}
  ]
},
{
  id:"publishing", num:8, title:"Web Publishing & Hosting", sub:"Domains, hosting plans & going live with FTP",
  learn:[
    {
      h:"1. Domain Names & The DNS System",
      items:[
        "<strong>Definition of a Domain Name:</strong> A human-friendly alphanumeric web address (e.g. <code>waecnigeria.org</code>) that identifies a specific website on the internet.",
        "<strong>Anatomy of a URL:</strong>",
        "<code>https://portal.myschool.edu.ng/index.html</code>",
        "• <code>https://</code>: Protocol (Encrypted HTTP).",
        "• <code>portal.</code>: Subdomain.",
        "• <code>myschool</code>: Domain Name (Second-Level Domain).",
        "• <code>.edu.ng</code>: Top-Level Domain (TLD).",
        "<strong>Classification of TLDs:</strong>",
        "• <strong>Generic TLDs (gTLDs):</strong> <code>.com</code> (Commercial), <code>.org</code> (Non-profit organizations), <code>.net</code> (Network), <code>.info</code>.",
        "• <strong>Country-Code TLDs (ccTLDs):</strong> Dedicated to specific sovereign countries (e.g. <code>.ng</code> for Nigeria, <code>.uk</code> for United Kingdom, <code>.gh</code> for Ghana).",
        "• <strong>Country-Code Second-Level Domains (ccSLDs):</strong> Specific namespaces in Nigeria managed by NiRA (Nigeria Internet Registration Association):",
        "  - <code>.edu.ng</code>: Tertiary and Higher Educational Institutions.",
        "  - <code>.sch.ng</code>: Primary and Secondary Schools.",
        "  - <code>.gov.ng</code>: Government ministries and parastatals.",
        "  - <code>.com.ng</code>: Commercial businesses in Nigeria.",
        "<strong>Domain Registrars:</strong> Accredited organizations (e.g. WhoGoHost, QServers, Namecheap, GoDaddy) where domain names are purchased and registered annually."
      ]
    },
    {
      h:"2. Web Hosting Architectures",
      items:[
        "<strong>Definition of Web Hosting:</strong> A commercial service providing physical server space, 24/7 internet bandwidth, and server computing power to store website files (HTML, CSS, images, databases) and make them accessible to world visitors.",
        "<strong>Types of Web Hosting Compared:</strong>",
        "• <strong>1. Shared Hosting:</strong>",

let speechSynth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
let currentUtterance = null;
let speechState = { isSpeaking:false, isPaused:false, text:"" };

function updateVoiceHud(){
  const hud = document.getElementById("voiceHud");
  if(!hud) return;
  if(speechState.isSpeaking){
    hud.style.display = "flex";
    document.getElementById("voiceStatusText").textContent = speechState.isPaused ? "⏸️ Paused: " + speechState.text : "🔊 Reading: " + speechState.text;
    document.getElementById("voicePauseBtn").textContent = speechState.isPaused ? "▶️ Resume" : "⏸️ Pause";
  } else {
    hud.style.display = "none";
  }
}

function stopSpeaking(){
  if(speechSynth){
    speechSynth.cancel();
  }
  speechState.isSpeaking = false;
  speechState.isPaused = false;
  updateVoiceHud();
}

function speakText(text, label){
  if(!speechSynth){
    alert("Audio Text-to-Speech is not supported on this browser.");
    return;
  }
  stopSpeaking();
  const clean = text.replace(/<[^>]*>/g, " ").replace(/&[a-z0-9#]+;/gi, " ").replace(/\s+/g, " ").trim();
  if(!clean) return;

  const utter = new SpeechSynthesisUtterance(clean);
  utter.rate = (state.a11y && state.a11y.speechRate) || 1.0;
  utter.pitch = 1.0;
  utter.lang = "en-US";

  utter.onstart = () => {
    speechState.isSpeaking = true;
    speechState.isPaused = false;
    speechState.text = label || (clean.length > 40 ? clean.slice(0, 40) + "..." : clean);
    updateVoiceHud();
  };
  utter.onend = () => {
    speechState.isSpeaking = false;
    speechState.isPaused = false;
    updateVoiceHud();
  };
  utter.onerror = () => {
    speechState.isSpeaking = false;
    speechState.isPaused = false;
    updateVoiceHud();
  };

  currentUtterance = utter;
  speechSynth.speak(utter);
}

function applyA11ySettings(){
  if(!state.a11y) state.a11y = { fontSize:"normal", theme:state.theme||"light", dyslexia:false, readingRuler:false, reduceMotion:false, speechRate:1.0 };
  
  // 1. Theme
  const theme = state.a11y.theme || state.theme || "light";
  state.theme = theme;
  document.body.classList.remove("dark", "theme-sepia", "theme-contrast", "theme-light");
  if(theme === "dark") document.body.classList.add("dark");
  else if(theme === "sepia") document.body.classList.add("theme-sepia");
  else if(theme === "contrast") document.body.classList.add("theme-contrast");
  else document.body.classList.add("theme-light");

  // 2. Font Size
  document.body.classList.remove("font-small", "font-normal", "font-large", "font-xlarge");
  document.body.classList.add("font-" + (state.a11y.fontSize || "normal"));

  // 3. Dyslexia Mode
  document.body.classList.toggle("dyslexia", !!state.a11y.dyslexia);

  // 4. Reduce Motion
  document.body.classList.toggle("reduce-motion", !!state.a11y.reduceMotion);

  // 5. Reading Ruler
  const ruler = document.getElementById("readingRuler");
  if(ruler) ruler.style.display = state.a11y.readingRuler ? "block" : "none";

  // 6. Update Theme Button Label in sidebar
  const themeBtn = document.getElementById("themeToggle");
  if(themeBtn){
    const labels = { light:"🌙 Dark mode", dark:"📜 Sepia mode", sepia:"⚡ High contrast", contrast:"☀️ Light mode" };
    themeBtn.textContent = labels[theme] || "🎨 Theme";
  }
}

function toggleFullscreen(){

    }
  }
}

function loadSavedState(){
  try{
    const raw = localStorage.getItem("ss2_digitech_state");
    if(raw){
      const saved = JSON.parse(raw);
      if(saved.student) state.student = saved.student;
      if(saved.visited) state.visited = new Set(saved.visited);
      if(saved.quizScores) state.quizScores = saved.quizScores;
      if(saved.cbtHistory) state.cbtHistory = saved.cbtHistory;
      if(saved.flashcardMastery) state.flashcardMastery = saved.flashcardMastery;
      if(saved.theme) state.theme = saved.theme;
      if(saved.a11y) state.a11y = Object.assign({}, state.a11y, saved.a11y);
    }
  }catch(e){ console.warn("Storage load error", e); }
  applyA11ySettings();
}

function saveState(){
  try{
    const toSave = {
      student: state.student,
      visited: Array.from(state.visited),
      quizScores: state.quizScores,
      cbtHistory: state.cbtHistory,
      flashcardMastery: state.flashcardMastery,
      theme: state.theme,
      a11y: state.a11y
    };
    localStorage.setItem("ss2_digitech_state", JSON.stringify(toSave));
  }catch(e){ console.warn("Storage save error", e); }
}

function renderLearn(topic, content){
  const wrap = document.createElement("div");

  wrap.innerHTML = `
    <div class="note-action-bar no-print">
      <div>
        <strong>📖 Topic ${topic.num}: ${topic.title}</strong>
        <div class="hint" style="margin:2px 0 0;">Complete Senior Secondary (SS2) First Term Scheme of Work Notes</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="mini-btn ghost" id="readNoteBtn">🔊 Listen to Note</button>
        <button class="mini-btn ghost" id="copyNoteBtn">📋 Copy Full Note</button>
        <button class="mini-btn" id="printNoteBtn">🖨️ Print / Save PDF</button>
      </div>
    </div>
  `;

  topic.learn.forEach(block => {
    const div = document.createElement("div");
    div.className = "note-box";
    div.innerHTML = `<h3>${block.h}</h3><ul>${block.items.map(i=>`<li>${i}</li>`).join("")}</ul>`;
    wrap.appendChild(div);
  });

  // Summary box for physical notebook copying
  const summaryDiv = document.createElement("div");
  summaryDiv.className = "note-callout";
  summaryDiv.style.borderLeft = "4px solid var(--green)";
  summaryDiv.style.background = "#f4fbf7";
  summaryDiv.innerHTML = `
    <h4 style="margin:0 0 6px;color:#1c6b45;">📝 Summary to Copy into Exercise Notebook</h4>
    <p class="hint" style="margin:0 0 10px;">Students should ensure the definitions, formulas, and 5 key sections above are fully transcribed into their Digital Technologies classroom notes.</p>
    <div style="font-size:13px;line-height:1.6;color:#1c6b45;">
      ✓ Verified aligned with WAEC, NECO, and National Curriculum standards for SS2 Computer Studies & Data Processing.
    </div>
  `;
  wrap.appendChild(summaryDiv);

  content.appendChild(wrap);

  // Audio Speech Reader Event
  wrap.querySelector("#readNoteBtn").addEventListener("click", () => {
    let noteText = `Topic ${topic.num}: ${topic.title}. ${topic.sub}. `;
    topic.learn.forEach(b => {
      noteText += b.h.replace(/<[^>]+>/g, "") + ". ";
      b.items.forEach(item => {
        noteText += item.replace(/<[^>]+>/g, " ").replace(/&rarr;/g, " leads to ").replace(/&gt;/g, " greater than ").replace(/&lt;/g, " less than ").replace(/&times;/g, " times ") + ". ";
      });
    });
    speakText(noteText, `Topic ${topic.num}: ${topic.title}`);
  });

  // Copy Note Event
  wrap.querySelector("#copyNoteBtn").addEventListener("click", () => {
    let noteText = `SS2 DIGITAL TECHNOLOGIES — FIRST TERM NOTES\nTOPIC ${topic.num}: ${topic.title}\nSubtitle: ${topic.sub}\n\n`;
    topic.learn.forEach(b => {
      const plainH = b.h.replace(/<[^>]+>/g, "");
      noteText += `========================================\n${plainH}\n========================================\n`;
      b.items.forEach(item => {
        const plainItem = item.replace(/<[^>]+>/g, "").replace(/&gt;/g, ">").replace(/&lt;/g, "<").replace(/&times;/g, "x").replace(/&minus;/g, "-").replace(/&rarr;/g, "->").replace(/&approx;/g, "~");
        noteText += `• ${plainItem}\n`;
      });
      noteText += "\n";
    });
    navigator.clipboard.writeText(noteText).then(() => {
      const btn = wrap.querySelector("#copyNoteBtn");
      btn.textContent = "✓ Copied to Clipboard!";
      setTimeout(() => { btn.textContent = "📋 Copy Full Note"; }, 2500);
    }).catch(() => {
      alert("Note text copied!");
    });
  });

  // Print Note Event
  wrap.querySelector("#printNoteBtn").addEventListener("click", () => {
    window.print();
  });
}
function renderRealLife(topic, content){
  const wrap = document.createElement("div");
  wrap.innerHTML = topic.realLife.map(c=>`<div class="reallife-card"><h4>${c.t}</h4><p>${c.d}</p></div>`).join("");

}
function renderPractice(topic, content){
  const form = document.createElement("div");
  form.innerHTML = topic.practice.map((q,qi)=>`
    <div class="quiz-q" data-qi="${qi}">
      <p class="prompt">${qi+1}. ${q.q}</p>
      ${q.opts.map((o,oi)=>`<label class="quiz-opt" data-oi="${oi}"><input type="radio" name="q${qi}" value="${oi}"> ${o}</label>`).join("")}
      <div class="quiz-feedback" id="fb-${qi}"></div>
    </div>
  `).join("") + `
    <button class="btn-check" id="checkBtn">Check my answers</button>
    <div class="quiz-score" id="scoreBox" style="display:none;"><span>Score</span><span class="num" id="scoreNum">0 / 0</span></div>
  `;
  content.appendChild(form);
  document.getElementById("checkBtn").addEventListener("click",()=>{
    let score = 0;
    topic.practice.forEach((q,qi)=>{
      const selected = form.querySelector(`input[name="q${qi}"]:checked`);
      const fb = document.getElementById(`fb-${qi}`);
      const opts = form.querySelectorAll(`.quiz-q[data-qi="${qi}"] .quiz-opt`);
      opts.forEach((optEl,oi)=>{
        if(oi===q.correct) optEl.classList.add("correct");
        if(selected && parseInt(selected.value)===oi && oi!==q.correct) optEl.classList.add("incorrect");
      });
      if(selected && parseInt(selected.value)===q.correct){
        score++; fb.className = "quiz-feedback show ok"; fb.textContent = "Correct — " + q.exp;
      } else {
        fb.className = "quiz-feedback show bad";
        fb.textContent = (selected ? "Not quite — " : "No answer selected — ") + q.exp;
      }
    });
    document.getElementById("scoreBox").style.display = "flex";
    document.getElementById("scoreNum").textContent = `${score} / ${topic.practice.length}`;
    document.getElementById("checkBtn").disabled = true;
    state.quizScores[topic.id] = { score, total: topic.practice.length };
    saveState();
    updateProgressFooter();
  });
}

let clockInterval = null;
function startClock(root){
  if(clockInterval) clearInterval(clockInterval);
  function tick(){
    const timeEl = root.querySelector("#liveTime"), dateEl = root.querySelector("#liveDate"), greetEl = root.querySelector("#liveGreet");
    if(!timeEl || !document.body.contains(timeEl)){ clearInterval(clockInterval); clockInterval=null; return; }
    const now = new Date();
    timeEl.textContent = now.toLocaleTimeString('en-GB');
    dateEl.textContent = now.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
    if(greetEl){
      const h = now.getHours();
      const word = h<12 ? "Good morning" : h<17 ? "Good afternoon" : "Good evening";
      const name = state.student ? state.student.name.split(" ")[0] : "there";
      greetEl.textContent = `${word}, ${name}!`;
    }
  }
  tick();
  clockInterval = setInterval(tick, 1000);
}
function computeStats(){
  const scores = Object.values(state.quizScores);
  const avg = scores.length ? Math.round(scores.reduce((s,x)=>s+(x.score/x.total*100),0)/scores.length) : null;
  return { explored: state.visited.size, total: TOPICS.length, quizzesTaken: scores.length, avgScore: avg };
}
